<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fate Storyline Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --panel:#FFFFFF; --ink:#16181D; --dim:#7C7E76; --line:#DADBD3;
  --accent:#B4540A; --accent-soft:#F4E4D4;
  --triumph:#1F7A5C; --sale:#3E6BD6; --noble:#7A5CC0; --disgrace:#9C3B2E; --ruin:#2B2B28;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161A; --panel:#1B1E23; --ink:#ECEDea; --dim:#8B8D85; --line:#33363C;
  --accent:#E57A2E; --accent-soft:#3A2A1C;
}}
:root[data-theme="dark"]{
  --paper:#14161A; --panel:#1B1E23; --ink:#ECEDea; --dim:#8B8D85; --line:#33363C;
  --accent:#E57A2E; --accent-soft:#3A2A1C;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--mono);cursor:pointer;background:none;border:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.masthead{font-family:'Orbitron',var(--mono);font-weight:800;font-size:15px;letter-spacing:.14em}
.masthead span{color:var(--accent)}
.tabs{display:flex;gap:6px}
.tab{font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.tab.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px}
.search input{font-family:var(--mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 10px;width:200px}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.legend{display:flex;gap:16px;padding:7px 20px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim);flex-wrap:wrap;background:var(--panel)}
.lg{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:0;border-top:2px solid var(--ink);display:inline-block}
.sw.deal{border-top-style:dashed}
.sw.ruin{border-top-color:#9C3B2E}
.sw.gold{border-top-color:#B98A1F}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.stage{position:relative;flex:1;overflow:auto}
.lane{position:relative;margin:26px 30px}
.lane-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.lane-title{font-family:'Orbitron',var(--mono);font-weight:600;font-size:13px;letter-spacing:.12em}
.lane-tag{color:var(--dim);font-size:12px}
.lane-stats{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.canvas{position:relative;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 44px,
  radial-gradient(var(--line) 1px,transparent 1px) 0 0/44px 44px;}
svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.edge{fill:none;stroke:var(--ink);stroke-opacity:.38;stroke-width:1.4}
.edge.deal{stroke-dasharray:5 5;stroke-opacity:.26}
.edge.ruin{stroke:#9C3B2E;stroke-dasharray:2 4;stroke-opacity:.75}
.edge.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.edge.dimmed{stroke-opacity:.05}
.node{position:absolute;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:9px 11px;cursor:pointer;transition:box-shadow .12s, opacity .15s}
.node:hover{box-shadow:0 2px 0 0 var(--ink)}
.node.pool{border-style:dashed;border-color:var(--dim)}
.node.deck,.node.bank{border-radius:999px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--dim);border-color:var(--dim)}
.node.bank{color:#9C3B2E;border-color:#9C3B2E}
.ntitle{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.02em;line-height:1.35}
.ngist{color:var(--dim);font-size:11px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chiprow{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:1px 6px;border:1px solid var(--line);border-radius:99px;color:var(--dim)}
.chip.spk{color:var(--accent);border-color:var(--accent)}
.node.ending{border-width:2px;text-align:left}
.node.ending .ntitle{font-size:11px}
.k-triumph{border-color:var(--triumph)} .k-sale{border-color:var(--sale)} .k-noble{border-color:var(--noble)} .k-disgrace{border-color:var(--disgrace)} .k-ruin{border-color:var(--ruin)}
.node.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.node.lit{box-shadow:0 0 0 3px var(--accent-soft),0 2px 0 0 var(--ink)}
.node.dimmed{opacity:.13;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s ease;overflow-y:auto;z-index:10}
.drawer.open{transform:none;box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.dhead{padding:14px 18px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dkicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.dtitle{font-family:'Orbitron',var(--mono);font-weight:600;font-size:14px;letter-spacing:.06em;margin-top:3px;text-wrap:balance}
.dclose{position:absolute;top:12px;right:14px;font-size:16px;color:var(--dim)}
.dclose:hover{color:var(--ink)}
.dbody{padding:14px 18px 24px}
.dspeaker{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:8px}
.dprose{font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.dchoices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{border:1px solid var(--line);border-left:3px solid var(--ink);padding:9px 11px;border-radius:0 4px 4px 0}
.choice.jump{cursor:pointer}
.choice.jump:hover{border-left-color:var(--accent);background:var(--accent-soft)}
.clabel{font-weight:600;font-size:13px}
.creq{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:3px}
.ceffects{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px;display:flex;flex-direction:column;gap:1px}
.cresult{font-size:12px;color:var(--dim);margin-top:5px;font-style:italic}
.ctargets{font-family:var(--mono);font-size:10px;margin-top:5px;color:var(--dim)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 16px;z-index:20}
@media (prefers-reduced-motion:no-preference){.node{transition:box-shadow .12s,opacity .15s}.drawer{transition:transform .18s ease}}
</style>
</head>
<body>
<header class="topbar">
  <div class="masthead">FATE<span>·</span>STORYLINE MAP</div>
  <nav class="tabs" id="tabs"></nav>

</header>
<div class="legend">
  <span class="lg"><span class="sw"></span>authored sequence</span>

  <span class="lg"><span class="dotk"></span>scene&nbsp;&nbsp;<span class="dotk" style="border-color:#B98A1F"></span>ending</span>

</div>

</aside>

<script>
const DATA = {"chapters":[{"id":"hyperchute","title":"HYPERCHUTE","tagline":"A railway in the sky, built from a garage.","stats":{"scenes":67,"choices":120,"endings":5},"nodes":[{"id":"hyperchute:_deck","kind":"deck","title":"THE WORLD","prose":"Deals scenes into play as weeks pass.","x":80,"y":24,"w":96,"h":40},{"id":"hyperchute:_bank","kind":"bank","title":"$0","prose":"Treasury hits zero — the insolvency scene forces a rescue or the end.","x":80,"y":98,"w":96,"h":40},{"id":"hyperchute:h_entry","kind":"scene","title":"THE GARAGE","prose":"A rented unit above the Sudz & Spin laundromat in the Flats. Dryer heat, solder smoke, and one prototype shuttle hanging from the ceiling on a braided tether — a shoebox with rotors and a pneumatic drop-tube salvaged from a dead bank’s drive-through. On your screen, the incorporation papers say you own one hundred percent of a company called HYPERCHUTE. Through the window, a MERIDIAN drone hums past with someone’s cold-pressed juice. Nobody knows your name yet. That cuts both ways.","priority":false,"fuse":false,"choices":[{"label":"Book a corridor pilot with the city — proof before polish","effects":["set company:pilot_booked = true","Stress +5"],"result":"You file the application at 2 a.m., high on it.","targets":["hyperchute:h_b_filing"]},{"label":"Recruit an advisor before anyone important sees this","effects":[],"result":"Credibility is also infrastructure.","targets":["hyperchute:h_b_advisor_hunt"]},{"label":"Incorporate clean — lawyer first, hardware second","effects":[],"result":"Paper first. It’s never just paper.","targets":["hyperchute:h_b_paper_first"]}],"x":24,"y":172,"w":208,"h":109},{"id":"hyperchute:h_priya_pitch","kind":"scene","title":"TWO PERCENT","speaker":"Priya Raghavan","prose":"Priya Raghavan routed freight across three continents and survived two bankruptcies that were not her fault. She gives the garage exactly four seconds of inspection. ‘You’ve built a machine that drops boxes out of the sky onto people’s homes. You have no permits, no insurer, and no idea which deputy commissioner already hates you. I can fix all three.’ She slides a term sheet across the workbench: two percent, vesting over twelve months, advisory role, introductions included.","priority":false,"fuse":false,"choices":[{"label":"“Welcome aboard.”","effects":["Meet Priya Raghavan","Priya Raghavan: affinity +2, respect +2","Priya Raghavan +2% equity","Founder score +1","Stress −3"],"result":"She shakes once, dry and firm, then starts a list titled THINGS THAT WILL KILL YOU FIRST.","targets":["hyperchute:h_b_priya_signed"]},{"label":"“Cash when the angel money lands. Waitlist me.”","effects":["Meet Priya Raghavan","Priya Raghavan: affinity -1","set company:priya_waitlist = true","Stress +2"],"result":"Her smile doesn’t move. ‘Sure. I’ll be here.’","targets":["hyperchute:h_b_priya_waitlist"]},{"label":"“I’ll go it alone.”","effects":["Meet Priya Raghavan","Priya Raghavan: affinity -2, respect -1","set company:priya_declined = true","Stress +2"],"result":"Nineteen years of pattern recognition folds its term sheet and leaves without another word.","targets":["hyperchute:h_b_priya_alone"]}],"x":24,"y":315,"w":208,"h":109},{"id":"hyperchute:h_tomas_terms","kind":"scene","title":"TWO WAYS TO PAY ME","speaker":"Tomás Reyes","prose":"Tomás Reyes does contracts out of a converted shipping container downtown and bills like a man who has read every clause he has ever written. ‘Everyone wants the big-firm lawyer until the invoice lands,’ he says. He writes two numbers on the garage wall in marker: $18,000 flat. Or one percent — “and my rolodex goes with it.”","priority":false,"fuse":false,"choices":[{"label":"$18,000 cash","requires":"treasury ≥ +$18,000","effects":["Treasury −$18,000","Meet Tomás Reyes","Tomás Reyes: affinity +1","set company:legal_solid = true","Stress −3"],"result":"He drafts the IP assignment before he leaves. Everything you build now actually belongs to the company.","targets":["hyperchute:h_b_papered"]},{"label":"One percent, plus the rolodex","effects":["Meet Tomás Reyes","Tomás Reyes: affinity +2, respect +2","Tomás Reyes +1% equity","set company:lawyer_ally = true","Founder score +1","Stress −2"],"result":"‘Smart,’ he says, pocketing the marker. ‘Broke founders make the best clients. Something to prove.’","targets":["hyperchute:h_b_rolodex"]},{"label":"Download templates. How hard can it be?","effects":["Stress +4","set company:diy_legal = true"],"result":"The templates are fine. Probably. The templates are probably fine.","targets":["hyperchute:h_b_diy"]}],"x":24,"y":458,"w":208,"h":94},{"id":"hyperchute:h_permit_wall","kind":"scene","title":"NO PROVEN DESCENT SAFETY CASE","speaker":"Office of Aerial Corridors","prose":"The Office of Aerial Corridors denies your pilot application in 0.4 seconds. The rejection notice cc’s three departments you have never heard of and one — Department of Sidewalk Integrity — that sounds invented. At the bottom, in machine-perfect passive voice: REAPPLICATION PERMITTED UPON DEMONSTRATED DESCENT COMPLIANCE.","priority":true,"fuse":true,"choices":[{"label":"File a full appeal with engineered descent data","effects":["Treasury −$6,000","Stress +6","set company:corridor = \"appealed\"","set company:permit_done = true","Meet Office of Aerial Corridors"],"result":"Three weeks to a hearing. Your descent-safety case is forty pages of hope formatted as engineering.","targets":["hyperchute:h_b_appeal_prep"]},{"label":"Launch unlicensed over your own block. Beg forgiveness.","effects":["Stress +8","Cred −1","set company:corridor = \"rogue\"","set company:permit_done = true","Meet Office of Aerial Corridors"],"result":"Twelve perfect drops onto your own roof. A neighbor films the thirteenth.","targets":["hyperchute:h_b_rogue_nights"]},{"label":"Lobby. Quietly, properly, expensively.","requires":"has met Tomás Reyes AND NOT (flag company:lawyer_ally = true)","effects":["Treasury −$9,000","set company:corridor = \"granted\"","set company:permit_done = true","Meet Office of Aerial Corridors","Office of Aerial Corridors: affinity +1"],"result":"Tomás knows which consultant owns which signature. Nine days later, the pilot corridor exists.","targets":["hyperchute:h_b_corridor_granted"]},{"label":"Call in Tomás’ favor","requires":"flag company:lawyer_ally = true","effects":["set company:corridor = \"granted\"","set company:permit_done = true","Tomás Reyes: affinity +1","Stress −2","Meet Office of Aerial Corridors"],"result":"Tomás makes one call from the container. ‘Fast-tracked. Don’t make me spend this twice.’","targets":["hyperchute:h_b_corridor_granted"]}],"x":24,"y":586,"w":208,"h":94},{"id":"hyperchute:h_hearing","kind":"scene","title":"THE DESCENT-SAFETY HEARING","prose":"Room 4-B of the Office of Aerial Corridors smells like toner and judgment. Your forty pages of hope-formatted-as-engineering hold up better than anyone expected — the descent case survives two rounds of questions and one live demo video that makes a commissioner say “huh” out loud. Deliberation lasts eleven minutes. The pilot corridor is granted.","priority":true,"fuse":true,"choices":[{"label":"Accept the corridor. Fly legal.","effects":["set company:corridor = \"granted\"","Cred +1","Founder score +1","Stress −5","Meet Office of Aerial Corridors","Office of Aerial Corridors: respect +1"],"result":"Stamped, sealed, e-mailed. The sky over the Flats is officially yours — two hundred feet at a time.","targets":["hyperchute:h_b_first_corridor"]}],"x":24,"y":714,"w":208,"h":94},{"id":"hyperchute:h_june_via_tomas","kind":"scene","title":"THE ANGEL","prose":"June Park arrives thirty seconds after Tomás, because she was never far away. Eleven angel checks; an instinct she calls pattern-matching and everyone else calls luck. She walks under the tethered shuttle, looks up for a long moment, and says: “A railway in the sky. Huh. My grandmother rode a train two days to reach a port. People will pay for gravity that behaves.”","priority":true,"fuse":false,"choices":[{"label":"Hear her out","effects":[],"targets":["hyperchute:h_june_term"]}],"x":24,"y":842,"w":208,"h":94},{"id":"hyperchute:h_june_cold","kind":"scene","title":"SOMEONE IS WATCHING YOUR DEMO","prose":"The rooftop test footage leaks — of course it leaks — and by Friday it has four hundred thousand views and a comment section arguing about property values. Monday morning, a woman in an expensive jacket is downstairs in the laundromat asking which unit is yours. June Park does not wait for permission to climb the stairs.","priority":true,"fuse":false,"choices":[{"label":"Hear her out","effects":[],"targets":["hyperchute:h_june_term"]}],"x":24,"y":970,"w":208,"h":94},{"id":"hyperchute:h_june_term","kind":"scene","title":"ONE FIFTY FOR EIGHT","speaker":"June Park","prose":"June turns her phone around: a wiring diagram of your own shuttle, annotated in three colors. ‘I read everything. Here’s my number. One hundred fifty thousand for eight percent. I don’t lead rounds I can’t defend at dinner parties — and a railway in the sky? I can defend that.’","priority":false,"fuse":false,"choices":[{"label":"Take the check","effects":["Treasury +$150,000","Meet June Park","June Park +8% equity","June Park: affinity +1","Founder score +2","Stress −4","set company:angel_funded = true"],"result":"The wire clears Wednesday. The garage suddenly smells like possibility instead of dryer sheets.","targets":["hyperchute:h_b_wired"]},{"label":"“Six percent.” See if she flinches","effects":["Treasury +$150,000","Meet June Park","June Park +7% equity","June Park: affinity -1, respect +1","Founder score +2","Stress −3","set company:angel_funded = true"],"result":"She doesn’t blink. ‘Seven. Because you asked. Don’t negotiate with me twice.’","targets":["hyperchute:h_b_wired"]},{"label":"Stay clean while it’s still yours","effects":["Meet June Park","June Park: affinity +1, respect +1","Stress +4","set company:bootstrapping = true"],"result":"She leaves a card on the workbench anyway. ‘When you’re ready to move, move fast. Doors like me don’t stay open.’","targets":["hyperchute:h_b_bootstrap"]}],"x":24,"y":1098,"w":208,"h":94},{"id":"hyperchute:h_first_drops_clean","kind":"scene","title":"BEAM DOWN","prose":"Shuttle One holds station two hundred feet above the Delgado house at 6:58 a.m. The tube coughs once — then the parcel drops through the receiver sleeve and lands on the porch soft as rain. Mrs. Delgado films it screaming. By noon there are sixty names on a waiting list scrawled on the back of a parking citation.","priority":true,"fuse":false,"choices":[{"label":"Open the list. Take every customer you can.","effects":["Revenue +$2,400/wk","Burn +$1,500/wk","Stress −5","Cred +1","Founder score +2","set company:drops_done = true"],"result":"Growth is a decision. You just made it.","targets":["hyperchute:h_b_scale_strain"]},{"label":"Cap it at twenty homes. Do it right first.","effects":["Revenue +$1,400/wk","Stress −8","Cred +1","Founder score +1","set company:drops_done = true","set company:slow_growth = true"],"result":"Twenty porches, zero failures. Sofia would call that a dataset. Priya would call it leaving money outside.","targets":["hyperchute:h_b_scale_strain"]}],"x":24,"y":1226,"w":208,"h":94},{"id":"hyperchute:h_first_drops_rogue","kind":"scene","title":"TWELVE ROOFS, NO PERMISSION","prose":"Without a corridor you fly dawn shifts only, dropping to friends-of-friends who sign waivers printed at the laundromat. The money is real. So is the compliance van that circled the block twice last night, drone-shaped shadow and all.","priority":true,"fuse":false,"choices":[{"label":"Keep flying grey until the hearing","effects":["Revenue +$1,900/wk","Stress +6","Cred +1","Founder score +1","set company:drops_done = true","set company:grey_market = true"],"result":"Underground railways run on nerve. Yours is holding. For now.","targets":["hyperchute:h_b_grey_strain"]},{"label":"Ground the fleet. Volunteer the tech to the food bank.","effects":["Revenue +$300/wk","Stress −4","Cred +2","Founder score +2","set company:drops_done = true","set company:foodbank = true"],"result":"Legal, slow, and photographed. The city attorney follows the account. So does June Park.","targets":["hyperchute:h_b_grey_strain"]}],"x":24,"y":1354,"w":208,"h":94},{"id":"hyperchute:h_sofia_hire","kind":"scene","title":"READ YOUR CAP TABLE — IT’S CUTE","speaker":"Sofia Brandt","prose":"Sofia Brandt wrote kill-switch software for wind turbines and treats altitude the way surgeons treat scalpels. She reads your flight logs on the stairs, fixes a gimbal jitter nobody had noticed, and names her price without looking up: nine five a month. Then she glances at your incorporation papers. “Or three points. I’ve read your cap table — it’s cute.”","priority":true,"fuse":true,"choices":[{"label":"$9,500 a month, full-time","effects":["Burn +$9,500/wk","Meet Sofia Brandt","Sofia Brandt: affinity +1","Stress −2","set company:sofia_resolved = true","set company:sofia_full = true"],"result":"By Friday she has rewritten the descent controller and deleted half of it. The code is smaller. It falls better.","targets":["hyperchute:h_b_sofia_settled"]},{"label":"Three points","effects":["Burn +$5,200/wk","Meet Sofia Brandt","Sofia Brandt +3% equity","Sofia Brandt: respect +1","Founder score +1","set company:sofia_resolved = true","set company:sofia_equity = true"],"result":"‘Points it is.’ She shakes like she’s closing a merger. Half-time, all-heart, and your burn survives the month.","targets":["hyperchute:h_b_sofia_settled"]},{"label":"Contract her part-time, month to month","effects":["Burn +$4,000/wk","Meet Sofia Brandt","Sofia Brandt: affinity -1","Stress +3","set company:sofia_resolved = true","set company:sofia_parttime = true"],"result":"‘Month to month,’ she repeats, in the tone people use for things that end badly.","targets":["hyperchute:h_b_sofia_settled"]}],"x":24,"y":1482,"w":208,"h":94},{"id":"hyperchute:h_marcus_card","kind":"scene","title":"A BLACK CAR BELOW THE LAUNDROMAT","speaker":"Marcus Vale","prose":"Marcus Vale sends the car away and takes the stairs himself, which is his entire pitch. VP of Logistics Networks, MERIDIAN. He looks at the shuttle the way a man looks at a rival’s child — measuring how tall it might grow. “We considered tubes in ’27. Beautiful physics, ugly economics. Convince me yours grew up.”","priority":true,"fuse":false,"choices":[{"label":"Charm him. Rivals remember manners.","effects":["Meet Marcus Vale","Marcus Vale: affinity +1","Cred +1","Stress +2","set company:meridian_watching = true"],"result":"He laughs once — real, at something you didn’t plan to say. The card he leaves is heavier than cards should be.","targets":["hyperchute:h_b_after_vale"]},{"label":"Tell him MERIDIAN’s drones wake up whole streets","effects":["Meet Marcus Vale","Marcus Vale: hostile","Cred +1","Founder score +1","Stress +4","set company:meridian_enemy = true"],"result":"His face does something expensive. ‘Spoken like a man who’s never been shouted at by a board.’ The stairs down are slower than the stairs up.","targets":["hyperchute:h_b_after_vale"]},{"label":"Pitch him the partnership now","effects":["Meet Marcus Vale","Marcus Vale: affinity +1","Stress +3","set company:meridian_talks = true"],"result":"‘Not yet,’ he says, pleased you asked. ‘Grow a little. Ripeness is everything.’","targets":["hyperchute:h_b_after_vale"]}],"x":24,"y":1610,"w":208,"h":94},{"id":"hyperchute:h_nadia_call","kind":"scene","title":"THE JOURNALIST","speaker":"Nadia Osei","prose":"Nadia Osei writes the column founders pretend not to read. Her email is four words long: “Coffee? Off record?” Underneath, unasked-for, is her piece about MERIDIAN’s warehouse injuries — the one that got a VP moved to a satellite office. She is dangerous in both directions and wants you to know she knows it.","priority":false,"fuse":false,"choices":[{"label":"Full access. Show her everything.","effects":["Meet Nadia Osei","Nadia Osei: affinity +2, respect +1","Cred +2","Founder score +1","Stress +3","set company:press_friend = true"],"result":"She spends a day in the garage asking the questions investors are too polite for. The profile runs under the headline THE RAILWAY IN THE SKY.","targets":["hyperchute:h_b_after_nadia"]},{"label":"Off the record, carefully","effects":["Meet Nadia Osei","Nadia Osei: affinity +1","set company:press_cautious = true"],"result":"Two hours, two coffees, nothing usable and nothing burned. She respects the discipline. She notes it.","targets":["hyperchute:h_b_after_nadia"]},{"label":"No comment","effects":["Meet Nadia Osei","Nadia Osei: affinity -2, hostile","set company:press_enemy = true"],"result":"‘Everyone says that before the interesting part happens,’ she says, and writes something down anyway.","targets":["hyperchute:h_b_after_nadia"]}],"x":24,"y":1738,"w":208,"h":94},{"id":"hyperchute:h_act1_close","kind":"scene","title":"ELEVEN WEEKS IN","prose":"The laundromat owner raises your rent and calls it congratulations. The waiting list is a spreadsheet now. There is money in the account that did not come from anyone’s savings, and there is a folder of letters from the Office of Aerial Corridors thicker than the Bible in the room next door. Whatever comes next — the clone, the war, the thing nobody has thought of yet — the railway is real. You built that. With help you chose well or didn’t.","priority":true,"fuse":false,"choices":[{"label":"Face year two","effects":["Founder score +2","Stress −4","set company:act1_done = true"],"result":"Year two begins the way year one ended: faster than expected.","targets":["hyperchute:h_bridge_y2"]}],"x":24,"y":1866,"w":208,"h":109},{"id":"hyperchute:h_file_pilot","kind":"scene","title":"A RAILWAY NEEDS SKY","prose":"Everything you have assembled — the advice, the paper, the machine on its braided leash — points at the same missing ingredient: airspace that is legally yours. The Office of Aerial Corridors accepts pilot applications on Tuesdays. Every week you don’t file is a week the railway is a rumor with a prototype, and somewhere across town, MERIDIAN’s permits team files things for breakfast.","priority":true,"fuse":true,"choices":[{"label":"File the corridor pilot application","effects":["set company:pilot_booked = true","Stress +4"],"result":"Forty minutes of municipal forms and one checkbox — PROPOSED USE: DESCENT LOGISTICS — that has clearly never been checked before.","targets":["hyperchute:h_b_filing"]}],"x":24,"y":2009,"w":208,"h":94},{"id":"hyperchute:h_b_filing","kind":"scene","title":"WHAT THE CITY HEARS","prose":"The confirmation lands at 2:07 a.m.: APPLICATION RECEIVED — OFFICE OF AERIAL CORRIDORS. By morning it has been forwarded, according to the read receipts, to Zoning, to Insurance Compliance, and to something called the Department of Sidewalk Integrity. You spend the days after flying tether tests and refreshing a status page that says PENDING in a font you are learning to hate. Somewhere in a gray building, someone is deciding what to make of a railway in the sky.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_permit_wall"]}],"x":24,"y":2137,"w":208,"h":109},{"id":"hyperchute:h_b_advisor_hunt","kind":"scene","title":"CREDIBILITY SHOPPING","prose":"You draft a list of everyone serious who might answer a founder’s cold email: eleven names, then seven once you’re honest about it. Two reply. One wants a fee just for the conversation. The other — a retired freight executive your old boss once called “the reason our cargo survived two ports and one coup” — answers with a time and your own address. She has already looked up the garage. Priya Raghavan does her diligence before the meeting, not after.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_priya_pitch"]}],"x":24,"y":2280,"w":208,"h":109},{"id":"hyperchute:h_b_paper_first","kind":"scene","title":"HOW COMPANIES ACTUALLY DIE","prose":"You spend an evening reading startup post-mortems, and the pattern isn’t market or money — it’s paper. The founder who never assigned the IP and lost the company to a co-founder’s ex-employer. The SAFE with the clause nobody priced. The handshake that became a deposition. Three separate posts, years apart, end on some version of the same sentence: get a real lawyer before you need one. The name that keeps surfacing in the replies works out of a shipping container downtown.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_tomas_terms"]}],"x":24,"y":2423,"w":208,"h":109},{"id":"hyperchute:h_b_priya_signed","kind":"scene","title":"THINGS THAT WILL KILL YOU FIRST","speaker":"Priya Raghavan","prose":"Item one on Priya’s list is not permits, or insurance, or the deputy commissioner. It is your own paperwork. ‘Someone serious will ask for your data room within the month,’ she says, already typing the first introduction from your workbench. ‘Certificate of incorporation. IP assignments. A cap table that doesn’t embarrass us.’ The second intro replies the same night — interested, and asking one question first: who is your counsel? Priya reads it over your shoulder. ‘The real kind,’ she says. ‘If you don’t have that yet, there’s a shipping container downtown you should visit before you answer this email.’","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_tomas_terms"]}],"x":24,"y":2566,"w":208,"h":109},{"id":"hyperchute:h_b_priya_waitlist","kind":"scene","title":"THE LIST SHE LEFT ANYWAY","prose":"She leaves the term sheet unsigned but leaves something else: one handwritten page titled THINGS THAT WILL KILL YOU FIRST — ‘free of charge, so it kills you slower.’ Permits. Insurance. The deputy commissioner, by name. And underlined twice at the top: PAPERWORK — a company that isn’t papered isn’t a company, it’s a hobby with liability. The last line isn’t advice at all. It’s an address. A shipping container, downtown.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_tomas_terms"]}],"x":24,"y":2709,"w":208,"h":109},{"id":"hyperchute:h_b_priya_alone","kind":"scene","title":"ONE HUNDRED PERCENT OF EVERYTHING","prose":"Alone means all of it is yours: the equity, and also the incorporation forms at 1 a.m., the insurance questionnaire that wants a ‘chief compliance officer,’ the parts supplier who won’t open a purchase order without a countersigned master agreement. By Thursday you have signed your own name eleven times and understood maybe seven of them. The supplier’s procurement bot bounces your homemade contract with one automated suggestion, in bold: OBTAIN COUNSEL. Everyone you ask downtown mentions the same shipping container.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_tomas_terms"]}],"x":24,"y":2852,"w":208,"h":109},{"id":"hyperchute:h_b_papered","kind":"scene","title":"REAL ON PAPER","prose":"The documents come back in three days, tabbed where you sign. Certificate, bylaws, IP assignment, an equity plan you won’t need until you badly do. It is the least dramatic $18,000 of your life and, Tomás insists, the most important: ‘Nobody ever calls me about the year things went right.’ The company exists now in the way that survives arguments. Paper doesn’t fly, though. That part is still yours.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":2995,"w":208,"h":94},{"id":"hyperchute:h_b_rolodex","kind":"scene","title":"THE ROLODEX WAKES UP","speaker":"Tomás Reyes","prose":"The one percent starts working immediately. Introductions arrive in twos and threes — an insurance broker who doesn’t laugh at the words ‘descent risk,’ a fabricator with spare line capacity, a permits consultant who bills like sin. And one name Tomás mentions almost casually, the way people mention weather: an angel who has been asking around about ‘the tube thing in the Flats.’ ‘June Park,’ he says. ‘If she shows up, don’t negotiate like you’re grateful.’","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":3123,"w":208,"h":109},{"id":"hyperchute:h_b_diy","kind":"scene","title":"PROBABLY FINE","prose":"The templates are from three jurisdictions and two decades. You harmonize them at 3 a.m. with find-and-replace and adrenaline, initialing clauses that reference a Delaware you have never seen. By Friday the company is incorporated — self-certified, fee paid, real in the eyes of a state database. In the drawer where the documents live, something small and legal ticks like a cheap watch. You will hear it again someday.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":3266,"w":208,"h":94},{"id":"hyperchute:h_b_appeal_prep","kind":"scene","title":"FORTY PAGES OF HOPE","prose":"Three weeks to the hearing. You fly two hundred tether drops in six days and log every one: descent curves, wind-shear tables, failure modes with mitigation columns. The document grows teeth. Somewhere around page thirty you stop writing like a defendant and start writing like an engineer. The hearing notice arrives in the mail with a room number: 4-B.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":3394,"w":208,"h":94},{"id":"hyperchute:h_b_rogue_nights","kind":"scene","title":"DAWN SHIFTS","prose":"Rogue flying has rules too — yours. Dawn only. Your own block. Waivers signed, catch-nets on the porches of the willing. The neighbors who said yes start leaving their porch lights on for the 6 a.m. run, which is either community or evidence, depending on who is asking. On Thursday, a van with government plates makes its first slow lap of the block. Everyone pretends not to notice each other.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_first_drops_rogue"]}],"x":24,"y":3522,"w":208,"h":94},{"id":"hyperchute:h_b_corridor_granted","kind":"scene","title":"A LINE ON A MAP","prose":"The permit arrives as a shapefile and a stamp: one corridor, two hundred feet, your block and the four around it. You print the map and pin it over the workbench — a thin blue line through the Flats, the first airspace in this city that answers to you. Beneath it, in the approval conditions, the sentence that matters: OPERATIONS MAY COMMENCE UPON RECEIPT. That’s tomorrow, if the batteries charge tonight.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_first_drops_clean"]}],"x":24,"y":3650,"w":208,"h":94},{"id":"hyperchute:h_b_first_corridor","kind":"scene","title":"STAMPED","prose":"The certificate arrives by email, then — absurdly, wonderfully — by mail, with a raised seal you run a thumb over twice. One corridor, two hundred feet, renewable on compliance. The boring paperwork, it turns out, is how you inherit the sky. The first legal drop is scheduled for 6:58 a.m. Tuesday, to a Mrs. Delgado, who signed the receiver-sleeve agreement in cursive.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_first_drops_clean"]}],"x":24,"y":3778,"w":208,"h":94},{"id":"hyperchute:h_b_wired","kind":"scene","title":"WHAT MONEY SOUNDS LIKE","prose":"The wire lands and the garage changes pitch. You pay the laundromat three months forward, order the good connectors, book fabrication line time like someone who means it. June’s first investor-update request is one sentence: ‘Numbers monthly, surprises never.’ You tape it above the workbench. There is suddenly a version of this company that dies from spending instead of starving, and it is your job to never meet it.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":3906,"w":208,"h":94},{"id":"hyperchute:h_b_bootstrap","kind":"scene","title":"RAMEN MATH","prose":"Clean means counting. You do the arithmetic on the whiteboard where an investor’s logo would have gone: every dollar of revenue is one you never have to explain to anyone, and every week is a bet that the machine earns faster than it burns. June’s card stays on the workbench, face up, like a fire alarm behind glass. Some founders are built for this. You are about to find out which kind you are.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":4034,"w":208,"h":94},{"id":"hyperchute:h_b_scale_strain","kind":"scene","title":"THE JITTER","prose":"Real porches are not tether tests. Wind eddies off the roofline of the Delgado house, a receiver sleeve sags on its bolts, and somewhere in the descent controller a gimbal correction fires ninety milliseconds late. Drop forty-one lands hard enough to bruise a box of pears. Nobody films that one. You watch the log scroll past midnight and admit what the waiting list won’t let you say out loud: the software is the company now, and it needs somebody better than you.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_sofia_hire"]}],"x":24,"y":4162,"w":208,"h":109},{"id":"hyperchute:h_b_grey_strain","kind":"scene","title":"THE MARGIN FOR ERROR IS A ROOF","prose":"Flying without cover means no second chances — one hard landing on the wrong porch is a headline with your name in it. So you fly conservative, and even conservative shakes: a gimbal correction that fires late, a descent curve that flattens uglier every time the wind has opinions. You read the logs on the stairs at midnight. Whatever this company becomes, the next hire decides it — someone who treats altitude like a scalpel.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_sofia_hire"]}],"x":24,"y":4305,"w":208,"h":109},{"id":"hyperchute:h_b_sofia_settled","kind":"scene","title":"FALL BETTER","prose":"Her first week rewrites the descent stack in commits with one-word messages. The shuttle stops correcting like a nervous student and starts correcting like a reflex; the hard landings vanish from the logs entirely. The garage acquires a foam-block test rig and a rule about touching her oscilloscope. Once, near midnight, a black car idles across the street for twenty minutes, then leaves without anyone getting out. The company is getting good enough to be noticed. Both halves of that sentence matter.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":4448,"w":208,"h":109},{"id":"hyperchute:h_b_after_vale","kind":"scene","title":"BEING SEEN","prose":"The card sits on the workbench for a day before you pin it to the corkboard, slightly off-level, where it watches you work. MERIDIAN knows your name now — a company whose logistics division loses more money by lunch than you will spend this year. Whatever that visit was — scouting, courtesy, appetite — the war for the last mile has noticed the railway. Work faster.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":4591,"w":208,"h":94},{"id":"hyperchute:h_b_after_nadia","kind":"scene","title":"FILED AWAY","prose":"Journalists never really leave; they file. Whatever version of you Nadia carried down the stairs, it lives now in a drafts folder with your name on it, patient as a savings account, waiting for the day the railway becomes news again. In this city, it always becomes news again. You get one honest thing out of the encounter regardless: hearing your own company described back to you by someone paid to notice what founders hide.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":4719,"w":208,"h":109},{"id":"hyperchute:h_bridge_y2","kind":"scene","title":"YEAR TWO","prose":"The garage is an office now — six desks, a server rack where the workbench was. MERIDIAN’s clone, Chute, sells the same stops at forty percent less and loses money on every drop with a smile. The war you wanted is here. It wants everything you have.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_price_war"]}],"x":24,"y":4862,"w":208,"h":94},{"id":"hyperchute:h_price_war","kind":"scene","title":"THE PRICE OF PRICE","prose":"Chute’s underpricing works. Your waiting list flattens; two subscribers a day drift over the fence to their blue tubes. The board — you, and whoever you let in — meets over cold pizza. Somebody has to blink first.","priority":true,"fuse":true,"choices":[{"label":"Match them. Burn cash to hold the streets.","effects":["Burn +$2,600/wk","Revenue +$2,200/wk","Stress +5","set company:price_war = true"],"result":"Margins go to zero. The list stops shrinking. So does your sleep.","targets":["hyperchute:h_b_after_pricewar"]},{"label":"Sell reliability — the drop that never misses.","effects":["Revenue +$900/wk","Cred +1"],"result":"You publish a 99.97% on-time ledger, signed weekly. The Flats notices. So does the insurance industry.","targets":["hyperchute:h_b_after_pricewar"]},{"label":"Slip the city Chute’s incident reports.","effects":["Stress +4","set company:chute_dirt = true","Cred −1"],"result":"Anonymous, untraceable, effective. You tell yourself the reports are accurate. They are. Mostly.","targets":["hyperchute:h_b_after_pricewar"]}],"x":24,"y":4990,"w":208,"h":94},{"id":"hyperchute:h_couriers","kind":"scene","title":"THE COLLECTIVE","speaker":"Office of Aerial Corridors","prose":"The last mile is still human — contract couriers carry what tubes can’t reach upstairs. Their collective arrives with a letter: employee status, or the porches go unserved. MERIDIAN’s couriers signed nothing and got nothing. Yours read the news.","priority":false,"fuse":false,"choices":[{"label":"Grant it. W-2s, benefits, the whole paper trail.","effects":["Burn +$3,200/wk","Cred +2","Founder score +1","set company:couriers_ally = true","Stress −3"],"result":"The letter comes back signed with a note: FIRST COMPANY TO ASK PROPERLY. Your burn jumps. So does your standing.","targets":["hyperchute:h_b_after_couriers"]},{"label":"Offer a hybrid pool — guaranteed floors, no benefits.","effects":["Burn +$1,400/wk","Stress +3"],"result":"Half sign. Half organize harder.","targets":["hyperchute:h_b_after_couriers"]},{"label":"Automate the stairs. Machines don’t organize.","effects":["Burn +$600/wk","Cred −2","Stress +5","set company:couriers_enemy = true"],"result":"Stair-climbing attachments ship in six weeks. The picket signs appear in five.","targets":["hyperchute:h_b_after_couriers"]}],"x":24,"y":5118,"w":208,"h":94},{"id":"hyperchute:h_strike","kind":"scene","title":"THE PORCHES GO QUIET","prose":"The strike is polite and devastating: no courier serves a Hyperchute address, and the couriers taught the porches why. Chute’s couriers cross your picket lines for double pay. The neighborhood watches who blinks.","priority":true,"fuse":true,"choices":[{"label":"Negotiate. You were wrong about the stairs.","effects":["Burn +$1,800/wk","Cred +1","set company:couriers_ally = true","Stress −4"],"result":"You sign at the laundromat, on a table still warm from someone’s laundry. It plays on every local channel.","targets":["hyperchute:h_b_after_strike"]},{"label":"Hold firm. Machines finish the job.","effects":["Revenue −$900/wk","Stress +6","Cred −1"],"result":"The drop success rate holds at 94% and falls a point every week. The Flats starts a counter-list: porches that refuse your tubes.","targets":["hyperchute:h_b_after_strike"]}],"x":24,"y":5246,"w":208,"h":94},{"id":"hyperchute:h_cut_meridian_ipo","kind":"scene","title":"MERIDIAN GOES PUBLIC","prose":"They ring the bell on a Tuesday. By close, MERIDIAN is worth more than the city you live in. Marcus Vale’s face is on the financial channels, charming under studio lights: “Logistics is a solved problem. The last mile belongs to whoever owns the sky.” Your company is a rounding error on their press release — for now. The ticker behind him reads $91B. Yours reads a garage above a laundromat.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_permit_war"]}],"x":24,"y":5374,"w":208,"h":94},{"id":"hyperchute:h_permit_war","kind":"scene","title":"THE AUDIT","prose":"The Office of Aerial Corridors opens a full audit of every Hyperchute corridor — “routine,” says the press release MERIDIAN’s lobbyists helped write. Three of your eleven corridors suspend pending review. The city that loved you is being lobbied by people who own it.","priority":true,"fuse":true,"choices":[{"label":"Unleash Nadia. Make the lobbying the story.","requires":"has met Nadia Osei","effects":["Cred +2","Stress +4","set company:press_war = true","Founder score +1"],"result":"HER PIECE RUNS SUNDAY: THE SKY IS FOR SALE. The audit committee suddenly finds cameras at every hearing.","targets":["hyperchute:h_b_after_audit"]},{"label":"Hire the regulator who wrote the rules. For 1.5%.","effects":["Meet Dana Okafor","Dana Okafor +1.5% equity","Cred +1","set company:regulator_insider = true"],"result":"Dana Okafor spent nine years running the corridors office. She knows which signatures mean what. The audit finds “procedural irregularities, resolved.”","targets":["hyperchute:h_b_after_audit"]},{"label":"Comply completely. Pause the flagged corridors.","effects":["Revenue −$1,100/wk","Stress −3","Office of Aerial Corridors: respect +1"],"result":"Slow, clean, survivable. The corridors reopen in nine weeks with a letter of commendation nobody reads.","targets":["hyperchute:h_b_after_audit"]}],"x":24,"y":5502,"w":208,"h":94},{"id":"hyperchute:h_fresno","kind":"scene","title":"FRESNO IS BEHIND","prose":"The Fresno plant builds your shuttles and everyone else’s drones, and everyone else just ordered bigger. Lead times stretch from six weeks to nineteen. Every grounded shuttle is a porch you serve with a human courier at a loss.","priority":false,"fuse":false,"choices":[{"label":"Double the order. Cash up front for priority.","requires":"treasury ≥ +$80,000","effects":["Treasury −$80,000","Revenue +$1,300/wk","Stress +3"],"result":"Your shuttles move to line three, ahead of Chute’s. Money talks; Fresno listens.","targets":["hyperchute:h_b_after_fresno"]},{"label":"Qualify a second supplier in Reno.","effects":["Burn +$900/wk","Stress +3","set company:dual_source = true"],"result":"Reno’s tolerances are looser and their price is worse, but when Fresno wobbles, you don’t.","targets":["hyperchute:h_b_after_fresno"]},{"label":"Give Fresno’s owner points for guaranteed capacity.","effects":["Meet Ray Delgado","Ray Delgado +2% equity","set company:fresno_points = true","Revenue +$700/wk"],"result":"You carve two points from your own share for the man who makes your machines. He frames the certificate next to his first dollar.","targets":["hyperchute:h_b_after_fresno"]}],"x":24,"y":5630,"w":208,"h":94},{"id":"hyperchute:h_poach_sofia","kind":"scene","title":"THE OFFICE SHE DIDN’T ASK FOR","speaker":"Sofia Brandt","prose":"Sofia puts the offer letter on your desk without being asked: MERIDIAN, double salary, a team of nine, a title with “Principal” in it. “I’m not leaving,” she says. “But I’m not pretending I didn’t read it.” The kill-switch author of your entire descent stack is holding a ticket she hasn’t decided to use.","priority":true,"fuse":true,"choices":[{"label":"Two more points. Make her a founder in fact.","effects":["Sofia Brandt +2% equity","Sofia Brandt: affinity +2, respect +2","Burn +$1,000/wk","Founder score +1","Stress −3"],"result":"She tears the letter in half before you finish talking. “Principal,” she mutters. “Of a garage.”","targets":["hyperchute:h_b_after_poach"]},{"label":"Match the money, keep the equity yours.","effects":["Burn +$6,000/wk","Sofia Brandt: affinity -1"],"result":"She stays for the number. Both of you know what that means, and it isn’t love.","targets":["hyperchute:h_b_after_poach"]},{"label":"Let her go with blessing and a reference.","effects":["Sofia Brandt: affinity -2","Stress +6","set company:sofia_gone = true"],"result":"The descent controller has her fingerprints on every line. MERIDIAN just bought themselves a very good conscience and you lost yours.","targets":["hyperchute:h_b_after_poach"]}],"x":24,"y":5758,"w":208,"h":94},{"id":"hyperchute:h_viral","kind":"scene","title":"THE FOUR MINUTES","prose":"A man on Forty-First Street collapses. The 911 drone ETA is eleven minutes. The nearest Hyperchute tube carries a defibrillator to his porch in four — the courier who reached it first also knew CPR. The porch camera does the rest: 40 million views, every caption some version of THIS is what it’s for.","priority":false,"fuse":false,"choices":[{"label":"Ride it. National shows, op-eds, the whole arc.","effects":["Cred +2","Founder score +1","Stress +5","set company:went_national = true"],"result":"You do eleven interviews in six days and say the same true thing each time: the railway was always for this. The list grows by forty thousand names.","targets":["hyperchute:h_b_after_viral"]},{"label":"Send the courier. Keep yourself off camera.","effects":["Cred +1","Stress +1","Nadia Osei: respect +1"],"result":"Rosa from the courier pool does the shows, better than you ever would. The story becomes hers, which makes it bigger.","targets":["hyperchute:h_b_after_viral"]}],"x":24,"y":5886,"w":208,"h":94},{"id":"hyperchute:h_series_a","kind":"scene","title":"TWO MILLION, TWENTY POINTS","speaker":"June Park","prose":"June brings a partner from Sandhill and lets him talk for twenty minutes before she cuts in. “Two million. Twenty points. A real board, real governance, and enough runway to win the war instead of surviving it. This is the door I told you about. It only opens once.”","priority":true,"fuse":true,"choices":[{"label":"Take it. Win the war.","effects":["Treasury +$2,000,000","June Park +20% equity","Founder score +3","Stress −5","set company:series_a = true"],"result":"The wire clears on a Friday. On Monday there is a recruiting plan, a legal budget, and a board meeting on the calendar that includes you but is no longer yours alone.","targets":["hyperchute:h_b_after_a"]},{"label":"Counter at fifteen.","effects":["Treasury +$2,000,000","June Park +18% equity","June Park: respect +1","Founder score +3","set company:series_a = true"],"result":"“Eighteen,” she says, “because you asked twice.” The wire clears Friday.","targets":["hyperchute:h_b_after_a"]},{"label":"Stay independent. Own the whole thing or lose it all.","effects":["Stress +6","Founder score +1","set company:independent = true","June Park: affinity -1"],"result":"June nods slowly. “Then you’re betting the company every single week. Some founders are built for that.” The door closes politely, forever.","targets":["hyperchute:h_b_after_indep"]}],"x":24,"y":6014,"w":208,"h":94},{"id":"hyperchute:h_board","kind":"scene","title":"WHO HOLDS THE GAVEL","prose":"The charter is three pages of boilerplate until page four: board composition. June’s term sheet leaves it open, which means it is being decided right now, in this room, by whoever speaks first.","priority":true,"fuse":false,"choices":[{"label":"Founder-controlled: you, June, one neutral.","requires":"founder stake ≥ 55%","effects":["set company:board_set = true","set company:control = \"founder\"","Founder score +1"],"result":"You keep the gavel. June votes with you twice in year one and against you once, memorably.","targets":[]},{"label":"Even: you, June, an independent both accept.","effects":["set company:board_set = true","set company:control = \"shared\"","Cred +1","Stress +3"],"result":"Governance as marriage counseling. The independent is a retired ferry captain with no patience for either of you, which turns out to be exactly right.","targets":[]}],"x":24,"y":6142,"w":208,"h":79},{"id":"hyperchute:h_bridge_pre_act3","kind":"scene","title":"EIGHTEEN MONTHS OF WAR","prose":"Three corridors suspended, then reopened. A price war that cost you both a fortune and taught the city your names. Couriers with health insurance. Sofia’s descent controller, version nine. The war doesn’t end. It just gets older — until the morning it stops mattering, because of what happens on Richmond Street.","priority":true,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_cut_accident"]}],"x":24,"y":6255,"w":208,"h":94},{"id":"hyperchute:h_b_after_pricewar","kind":"scene","title":"TRENCHES","prose":"The fence-line stops moving — not because anyone won, but because both sides dug in. Blue tubes fall off lampposts in your blocks; strangers straighten yours without being asked. Pricing pages update hourly now, two ops teams learning each other’s rhythms like chess players who hate each other politely. Wars like this don’t end, you realize. They get priced in — by customers, by suppliers, and eventually by people with much bigger spreadsheets than yours.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_cut_meridian_ipo"]}],"x":24,"y":6383,"w":208,"h":109},{"id":"hyperchute:h_b_after_couriers","kind":"scene","title":"THE LAST MILE HAS A FACE","prose":"The decision travels through the courier pool faster than any memo could — group chats, stairwells, the bench outside the laundromat. For a while deliveries continue as they always did. But the porches heard about it too, because the couriers told them, name by name, landing by landing. In the Flats, how you treat the person on the stairs is public information. It compounds, one direction or the other, from here.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_cut_meridian_ipo"]}],"x":24,"y":6526,"w":208,"h":94},{"id":"hyperchute:h_b_after_strike","kind":"scene","title":"AFTER THE PICKETS","prose":"A strike leaves marks either way. Routes resume; some porches keep the flyer taped inside the receiver sleeve, as a warning or a receipt, depending. The couriers know exactly what you are now, and so does the neighborhood, and so does MERIDIAN — whose channels covered every day of it, gleefully, in HD, under the banner GROWING PAINS AT THE LITTLE RAILWAY. The war has a labor front now. You opened it.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":["hyperchute:h_cut_meridian_ipo"]}],"x":24,"y":6654,"w":208,"h":94},{"id":"hyperchute:h_b_after_audit","kind":"scene","title":"PAPER WEATHER","prose":"Audits end the way weather does — gradually, then officially, with a letter that thanks you for your cooperation whether you cooperated or not. The gray sedans stop appearing. What stays is the lesson: the sky you operate in is licensed, and licenses have politics, and politics has a payroll. Somewhere downtown a MERIDIAN lobbyist closes your file and opens next quarter’s version of it.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":6782,"w":208,"h":94},{"id":"hyperchute:h_b_after_fresno","kind":"scene","title":"SUPPLY LINES","prose":"The shuttle supply steadies — not fixed exactly, managed. You know your machines’ build dates now the way parents know due dates, and you check the line schedule before you check the news. Quietly, logistics becomes a weapon in the war ledger: every shuttle that ships on time is a porch Chute doesn’t take while you wait. Nobody films this part. It decides more than the parts they film.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":6910,"w":208,"h":94},{"id":"hyperchute:h_b_after_poach","kind":"scene","title":"WHAT THE LETTER MEANT","prose":"The envelope goes into a drawer, but its meaning stays out on the bench: MERIDIAN is recruiting your company one name at a time. Somewhere in a talent database there is an org chart of your garage, and someone’s job is keeping it current. The war stopped being about porches a while ago. It is about people now — and everyone on your stairs has a number next to their name that someone else is willing to pay.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":7038,"w":208,"h":94},{"id":"hyperchute:h_b_after_viral","kind":"scene","title":"AFTER THE FOUR MINUTES","prose":"The clip ages into legend at internet speed: stitched, captioned, argued about, taught. The waiting list grows a suburb. City hall calls twice — once to congratulate, once, quieter, to ask about capacity. Attention this size has weather of its own; for a few weeks everything the company does happens slightly on camera, and you learn to move like someone who knows it.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":7166,"w":208,"h":94},{"id":"hyperchute:h_b_after_a","kind":"scene","title":"GOVERNANCE ARRIVES","prose":"The money changes the math; the board changes the mirror. Hiring plans become real documents with real start dates. So does a calendar invite titled BOARD MEETING — the first meeting in the company’s life that you attend rather than convene. June’s texts get shorter and land harder. The garage doesn’t feel smaller, exactly. It feels witnessed.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":7294,"w":208,"h":94},{"id":"hyperchute:h_b_after_indep","kind":"scene","title":"THE WHOLE THING","prose":"Owning all of it has a sound: the door June closed, clicking, politely, forever. From here every payroll clears because revenue cleared, or it doesn’t clear at all. You tape the runway math to the wall where a term sheet would have hung and find, to your surprise, that you like looking at it. Some founders are built for this. The next quarter finds out which kind you are.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":[],"targets":[]}],"x":24,"y":7422,"w":208,"h":94},{"id":"hyperchute:h_cut_accident","kind":"scene","title":"RICHMOND STREET, 4:51 P.M.","prose":"A descent controller throws a transient fault — version nine, Sofia’s own code — and Shuttle Fourteen drops a forty-pound parcel from sixty feet instead of four. Mei-Lin Chen, fifty-eight, cycling home from the hospital where she has worked thirty-one years, is struck and severely injured. There is footage. There is always footage. By midnight, every channel in the city leads with the railway in the sky.","priority":false,"fuse":false,"choices":[{"label":"Continue","effects":["set company:act3_open = true"],"targets":["hyperchute:h_accident"]}],"x":24,"y":7550,"w":208,"h":94},{"id":"hyperchute:h_accident","kind":"scene","title":"THE FIRST FORTY-EIGHT HOURS","prose":"The lawyers, the insurer, and the pit in your stomach all say the same three things in different orders. The corridors office has opened an emergency investigation. Chute’s couriers are quietly delivering flowers to Ms. Chen’s block, which is the most cynical thing you have ever seen and it is working.","priority":true,"fuse":true,"choices":[{"label":"Ground the fleet. Cooperate with everything.","effects":["Revenue −$1,500/wk","Treasury −$40,000","Cred +2","Stress +8","set company:transparent = true"],"result":"You ground every shuttle before anyone asks and publish the fault report raw. Your general counsel calls it unilateral disarmament. The city calls it something it hasn’t called a startup in years: decent.","targets":[]},{"label":"Settle quietly. NDA, sealed, move on.","effects":["Treasury −$90,000","Stress +5","set company:nda = true"],"result":"The family’s lawyer is fair and the check is enormous and nobody is allowed to talk about it, including you. The fleet keeps flying. So does the fault, somewhere, in version nine.","targets":[]},{"label":"Blame the installation contractor. It was their sleeve.","effects":["Cred −2","Stress +4","set company:blame_shift = true"],"result":"The filing is technically accurate and morally legible to absolutely no one. The contractor’s lawyers return fire within a day, and now there are two stories and yours is the one with more money in it.","targets":[]}],"x":24,"y":7678,"w":208,"h":94},{"id":"hyperchute:h_press_storm","kind":"scene","title":"SHE HAS THE REPORT","speaker":"Nadia Osei","prose":"Nadia’s email is two words this time: “Coffee. Now.” She has the preliminary investigation draft — someone inside the corridors office leaked it — and forty-eight hours before she goes to press with whatever she has. “I’d rather have it from you,” she says. “But I’ll run it without you.”","priority":true,"fuse":false,"choices":[{"label":"Hand her everything, on record.","requires":"flag company:transparent = true","effects":["Cred +2","Founder score +1","Stress +3","Nadia Osei: affinity +2, respect +2"],"result":"Her piece runs with your fault report printed in full and one line everyone repeats: THE FOUNDER GROUNDED THE FLEET BEFORE THE CITY COULD. It does not undo what happened to Mei-Lin Chen. Nothing does. But it is the truth, and it is yours.","targets":[]},{"label":"Steer her — what to emphasize, what to bury.","effects":["Cred +1","Stress +2","Nadia Osei: respect -1"],"result":"The story runs softer than it might have. She notes, in her notebook and in her memory, exactly which sentences you asked her not to write.","targets":[]},{"label":"Stonewall. No comment, again.","effects":["Nadia Osei: affinity -2, hostile","Cred −2"],"result":"She runs it without you. The leak is worse than the report. The word “cover-up” appears in a headline above your company’s name.","targets":[]}],"x":24,"y":7806,"w":208,"h":94},{"id":"hyperchute:h_sofia_verdict","kind":"scene","title":"VERSION NINE","speaker":"Sofia Brandt","prose":"She wrote the code that failed. She has not slept, and she has rewritten the descent controller three times — version ten fails safe from any altitude, anywhere. What she cannot rewrite is whether she can stay. “Tell me who we are,” she says, “and I’ll tell you if I’m still here.”","priority":true,"fuse":false,"choices":[{"label":"“We ground first, publish everything, and fix it in daylight.”","requires":"flag company:transparent = true","effects":["Sofia Brandt: affinity +2, respect +2","Founder score +1","Cred +1","set company:sofia_verdict = true"],"result":"She stays. Version ten ships with her name on the commit and a kill-switch she demonstrates at the all-hands by dropping a shuttle onto foam blocks in the laundromat parking lot.","targets":[]},{"label":"“We survive. Whatever it takes.”","effects":["Sofia Brandt: affinity -3","Stress +6","set company:sofia_verdict = true","set company:sofia_gone = true"],"result":"She looks at you for a long moment, then starts packing her oscilloscope. The commit message on her last push reads: “for whoever inherits this.”","targets":[]}],"x":24,"y":7934,"w":208,"h":94},{"id":"hyperchute:h_suspension","kind":"scene","title":"EMERGENCY SUSPENSION HEARING","prose":"The corridors office votes Friday on emergency suspension of every Hyperchute corridor pending the investigation. Chute’s lobbyists are circulating a “public safety alternative” that is Chute, everywhere, immediately. You can testify, send counsel, or accept the pause and live to fly again.","priority":true,"fuse":true,"choices":[{"label":"Testify personally. Say her name, say version nine, say version ten.","effects":["Stress +7","Cred +2","Founder score +1","Office of Aerial Corridors: respect +2"],"result":"You testify for eleven minutes with your fleet grounded and your fault report in every commissioner’s hands. The suspension passes 4–1 — with a ninety-day review instead of indefinite, and the dissenting commissioner quotes you in the record.","targets":[]},{"label":"Send counsel. Let lawyers do lawyer work.","requires":"has met Tomás Reyes","effects":["Stress +2","Cred −1"],"result":"Tomás wins the procedural points and loses the room. Suspension passes with an indefinite tail. “You should’ve been the one standing there,” he says, not unkindly.","targets":[]},{"label":"Accept a 90-day pause without a fight.","effects":["Revenue −$1,600/wk","Stress −4","Office of Aerial Corridors: affinity +1"],"result":"Ninety days of silence over the Flats. Chute flies your routes at triple surge pricing. The neighborhood remembers who stopped and who profited.","targets":[]}],"x":24,"y":8062,"w":208,"h":94},{"id":"hyperchute:h_offer","kind":"scene","title":"THE OFFER, MID-STORM","speaker":"Marcus Vale","prose":"Marcus Vale comes to the garage — no car this time, no assistant, just a folder and a face doing something you have never seen it do, which is hesitate. “Acquisition. Two hundred million, your team absorbed, the tubes painted blue. Or keep bleeding through an investigation with my company lobbying your regulators. This isn’t a threat, it’s arithmetic.” He slides the folder across your own workbench. “Take the arithmetic.”","priority":true,"fuse":true,"choices":[{"label":"Sell. Two hundred million ends every problem.","effects":["set company:offer_done = true","■ ENDS CHAPTER — \"acquired\""],"targets":[]},{"label":"Counter: not the company. You. Rise inside MERIDIAN.","requires":"Marcus Vale affinity ≥ 1","effects":["set company:offer_done = true","■ ENDS CHAPTER — \"become_them\""],"targets":[]},{"label":"Refuse. The railway is not for sale.","effects":["Stress +5","Founder score +2","set company:offer_done = true","set company:refused = true"],"result":"You close the folder. Marcus stands, straightens his jacket, and — for one unguarded second — looks almost relieved. “Then win,” he says, and takes the stairs down.","targets":["hyperchute:h_war_room"]}],"x":24,"y":8190,"w":208,"h":109},{"id":"hyperchute:h_war_room","kind":"scene","title":"THE WAR ROOM","prose":"Whiteboards, cold noodles, everyone you have left. Three doors are still standing: the listing, if the numbers and the name can carry it; the stack, opened to the world; or the street — one more quarter fought porch by porch, no margin for error, all of it.","priority":true,"fuse":false,"choices":[{"label":"Ride for the listing.","requires":"founder score ≥ 12 AND cred ≥ 4","effects":["set company:endgame = true"],"targets":["hyperchute:h_ipo_road"]},{"label":"Open-source the stack. Give the railway to everyone.","effects":["set company:endgame = true","■ ENDS CHAPTER — \"walkaway_opensource\""],"targets":[]},{"label":"Fight on the streets. One more quarter.","effects":["set company:endgame = true","Stress +4"],"targets":["hyperchute:h_last_stand"]}],"x":24,"y":8333,"w":208,"h":94},{"id":"hyperchute:h_ipo_road","kind":"scene","title":"THE ROAD SHOW","prose":"Eleven cities in nine days. The underwriters want a story and you have a better one: a grounded fleet that got back up, a courier pool with health insurance, a fault report printed in full. The last meeting is the pricing call. Somewhere in the building, a banker says the words “the people’s network” without irony and everyone pretends that is normal.","priority":true,"fuse":false,"choices":[{"label":"Price it honest. Ring the bell.","requires":"cred ≥ 4 AND treasury ≥ +$100,000","effects":["set company:ipo_done = true","■ ENDS CHAPTER — \"triumph_ipo\""],"targets":[]},{"label":"Pull the listing — sell to the syndicate instead.","effects":["set company:ipo_done = true","■ ENDS CHAPTER — \"acquired\""],"targets":[]}],"x":24,"y":8461,"w":208,"h":94},{"id":"hyperchute:h_last_stand","kind":"scene","title":"THE LAST QUARTER","prose":"No bankers, no exits, no folder from Marcus. Just the Flats, the couriers, the porches, and ninety days to prove the railway deserves the sky. Chute outspends you ten to one. You have something they cannot buy, if — only if — it is still true.","priority":true,"fuse":false,"choices":[{"label":"Win the city back: free routes for schools and the food bank.","requires":"cred ≥ 2 AND runway ≥ 12wks","effects":["Revenue −$600/wk","Cred +2","Founder score +2","set company:last_done = true"],"result":"Ninety days later the Flats is yours again, porch by porch — and the bankers who stopped calling start calling back. There is exactly one door left, and it goes through a pricing call.","targets":["hyperchute:h_ipo_road"]},{"label":"Sell to the rival syndicate — anyone but MERIDIAN.","effects":["set company:last_done = true","■ ENDS CHAPTER — \"acquired\""],"targets":[]},{"label":"Go down swinging. Every corridor, every week, no surrender.","effects":["set company:last_done = true","■ ENDS CHAPTER — \"bankrupt\""],"targets":[]}],"x":24,"y":8589,"w":208,"h":94},{"id":"hyperchute:h_insolvency","kind":"scene","title":"RUNWAY ZERO","prose":"Payroll bounces. The bank’s notification tone is almost apologetic. Every founder learns this exact silence — the inbox that stops answering. HYPERCHUTE has weeks, maybe less. But doors remain, even now. They’re just all ugly.","priority":false,"fuse":false,"choices":[{"label":"Bridge loan against everything","requires":"NOT (flag company:bridge_used = true)","effects":["Treasury +$40,000","Stress +12","set company:bridge_used = true"],"result":"Signed at 11 p.m., against the IP, the shuttles, and — reading the clauses closely — possibly the tube itself.","targets":[]},{"label":"Down round — June doubles down on you","requires":"has met June Park AND NOT (flag company:down_used = true)","effects":["Treasury +$90,000","June Park +10% equity","June Park: respect -1","Stress +10","set company:down_used = true"],"result":"She wires it before the term sheet finishes printing. ‘This is the cheap money. Don’t make me do it again.’","targets":[]},{"label":"Acqui-hire: the team survives, the dream doesn’t","requires":"has met Marcus Vale","effects":["■ ENDS CHAPTER — \"acquired\""],"result":"MERIDIAN takes the engineers, the patents, and the domain name. The railway becomes a slide in someone else’s deck.","targets":[]},{"label":"Surrender","effects":["■ ENDS CHAPTER — \"bankrupt\""],"result":"You pay the final invoices from personal savings. Sixty customers send cards. The Flats still calls it the railway.","targets":[]}],"x":24,"y":8717,"w":208,"h":94},{"id":"hyperchute:h_burnout","kind":"scene","title":"THE BODY KEEPS SCORE","prose":"Sofia would call it a fault cascade. Priya would call it the thing that kills founders faster than money. Whatever you call it, the truth is on the table between you and the mirror: you are the single point of failure in a company that no longer fits inside one human being. Something yields this week. You choose what.","priority":false,"fuse":false,"choices":[{"label":"Three weeks somewhere with no sky traffic. Doctor’s orders.","effects":["Stress −45","Treasury −$6,000","set company:burnout_rested = true"],"result":"The company survives three weeks without you, which is its own hard lesson. You come back lighter, and the first thing you do is write down everything that only lived in your head.","targets":[]},{"label":"White-knuckle it. Founders don’t rest.","effects":["Stress −12","Cred −1"],"result":"You stay at the bench. The work gets done, worse than usual, by someone the team has quietly started managing around. The next time the pressure pegs the gauge, there will be nothing left to spend.","targets":[]},{"label":"Walk away. The receivers can have it.","effects":["■ ENDS CHAPTER — \"bankrupt\""],"result":"Some ledgers only balance when you stop paying into them.","targets":[]}],"x":24,"y":8845,"w":208,"h":94},{"id":"hyperchute:end:triumph_ipo","kind":"ending","title":"THE PEOPLE’S NETWORK","prose":"HYPERCHUTE lists at 9:31 a.m. Mrs. Delgado holds the ceremonial button on the exchange floor, still wearing her house slippers under the borrowed coat. The railway in the sky belongs to the street it was built for — and to the founder who refused, in order: a giant, a discount, and common sense.","endKind":"triumph","x":44,"y":8973,"w":168,"h":58},{"id":"hyperchute:end:acquired","kind":"ending","title":"DISSOLVED INTO BLUE","prose":"The tubes still run. They are painted MERIDIAN blue now, and they stop where the margins are best, not where people live. You are rich, which is not the same as right. The Flats keeps your sticker on the receiver sleeve anyway.","endKind":"sale","x":44,"y":9065,"w":168,"h":58},{"id":"hyperchute:end:bankrupt","kind":"ending","title":"BANKRUPT BUT BELOVED","prose":"The receivers take the shuttles; nobody can repossess what the neighborhood saw. Sixty porches watched parcels fall out of the sky like weather that loved them. Doors close. Some of them stay unlocked.","endKind":"noble","x":44,"y":9157,"w":168,"h":58},{"id":"hyperchute:end:become_them","kind":"ending","title":"YOU BECAME WHAT YOU FOUGHT","prose":"The badge is heavy and gets lighter every year. Your old prototype hangs in the MERIDIAN lobby under glass, labeled HERITAGE ARTIFACT. Sometimes you ride past the laundromat in the black car and do not look up.","endKind":"disgrace","x":44,"y":9249,"w":168,"h":58},{"id":"hyperchute:end:walkaway_opensource","kind":"ending","title":"THE STACK BELONGS TO EVERYONE","prose":"You publish everything: flight controller, tube spec, descent safety case. Within a year there are four hundred small railways over four hundred neighborhoods wearing different names. Yours is not one of them. That was the point.","endKind":"transformation","x":44,"y":9341,"w":168,"h":58}],"edges":[],"width":256,"height":9423},{"id":"teleport","title":"TELEPORT","tagline":"Be there without going.","stats":{"scenes":4,"choices":10,"endings":3},"nodes":[{"id":"teleport:_deck","kind":"deck","title":"THE WORLD","prose":"Deals scenes into play as weeks pass.","x":80,"y":24,"w":96,"h":40},{"id":"teleport:_bank","kind":"bank","title":"$0","prose":"Treasury hits zero — the insolvency scene forces a rescue or the end.","x":80,"y":98,"w":96,"h":40},{"id":"teleport:t_entry","kind":"scene","title":"TELEPORT — CHA
