<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fate Storyline Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --panel:#FFFFFF; --ink:#16181D; --dim:#7C7E76; --line:#DADBD3;
  --accent:#B4540A; --accent-soft:#F4E4D4;
  --triumph:#1F7A5C; --sale:#3E6BD6; --noble:#7A5CC0; --disgrace:#9C3B2E; --ruin:#2B2B28;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161A; --panel:#1B1E23; --ink:#ECEDea; --dim:#8B8D85; --line:#33363C;
  --accent:#E57A2E; --accent-soft:#3A2A1C;
}}
:root[data-theme="dark"]{
  --paper:#14161A; --panel:#1B1E23; --ink:#ECEDea; --dim:#8B8D85; --line:#33363C;
  --accent:#E57A2E; --accent-soft:#3A2A1C;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--mono);cursor:pointer;background:none;border:none;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.masthead{font-family:'Orbitron',var(--mono);font-weight:800;font-size:15px;letter-spacing:.14em}
.masthead span{color:var(--accent)}
.tabs{display:flex;gap:6px}
.tab{font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.tab.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px}
.search input{font-family:var(--mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:5px 10px;width:200px}
.search input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.legend{display:flex;gap:16px;padding:7px 20px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim);flex-wrap:wrap;background:var(--panel)}
.lg{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:0;border-top:2px solid var(--ink);display:inline-block}
.sw.deal{border-top-style:dashed}
.sw.ruin{border-top-color:#9C3B2E}
.sw.gold{border-top-color:#B98A1F}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block;border:1.5px solid var(--ink)}
.stage{position:relative;flex:1;overflow:auto}
.lane{position:relative;margin:26px 30px}
.lane-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.lane-title{font-family:'Orbitron',var(--mono);font-weight:600;font-size:13px;letter-spacing:.12em}
.lane-tag{color:var(--dim);font-size:12px}
.lane-stats{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.canvas{position:relative;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 44px,
  radial-gradient(var(--line) 1px,transparent 1px) 0 0/44px 44px;}
svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.edge{fill:none;stroke:var(--ink);stroke-opacity:.38;stroke-width:1.4}
.edge.deal{stroke-dasharray:5 5;stroke-opacity:.26}
.edge.ruin{stroke:#9C3B2E;stroke-dasharray:2 4;stroke-opacity:.75}
.edge.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2}
.edge.dimmed{stroke-opacity:.05}
.node{position:absolute;background:var(--panel);border:1.5px solid var(--ink);border-radius:4px;padding:9px 11px;cursor:pointer;transition:box-shadow .12s, opacity .15s}
.node:hover{box-shadow:0 2px 0 0 var(--ink)}
.node.pool{border-style:dashed;border-color:var(--dim)}
.node.deck,.node.bank{border-radius:999px;text-align:center;font-family:var(--mono);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--dim);border-color:var(--dim)}
.node.bank{color:#9C3B2E;border-color:#9C3B2E}
.ntitle{font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.02em;line-height:1.35}
.ngist{color:var(--dim);font-size:11px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chiprow{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:1px 6px;border:1px solid var(--line);border-radius:99px;color:var(--dim)}
.chip.spk{color:var(--accent);border-color:var(--accent)}
.node.ending{border-width:2px;text-align:left}
.node.ending .ntitle{font-size:11px}
.k-triumph{border-color:var(--triumph)} .k-sale{border-color:var(--sale)} .k-noble{border-color:var(--noble)} .k-disgrace{border-color:var(--disgrace)} .k-ruin{border-color:var(--ruin)}
.node.sel{outline:2.5px solid var(--accent);outline-offset:2px}
.node.lit{box-shadow:0 0 0 3px var(--accent-soft),0 2px 0 0 var(--ink)}
.node.dimmed{opacity:.13;pointer-events:auto}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,92vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s ease;overflow-y:auto;z-index:10}
.drawer.open{transform:none;box-shadow:-12px 0 32px rgba(0,0,0,.08)}
.dhead{padding:14px 18px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dkicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.dtitle{font-family:'Orbitron',var(--mono);font-weight:600;font-size:14px;letter-spacing:.06em;margin-top:3px;text-wrap:balance}
.dclose{position:absolute;top:12px;right:14px;font-size:16px;color:var(--dim)}
.dclose:hover{color:var(--ink)}
.dbody{padding:14px 18px 24px}
.dspeaker{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:8px}
.dprose{font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.dchoices{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.choice{border:1px solid var(--line);border-left:3px solid var(--ink);padding:9px 11px;border-radius:0 4px 4px 0}
.choice.jump{cursor:pointer}
.choice.jump:hover{border-left-color:var(--accent);background:var(--accent-soft)}
.clabel{font-weight:600;font-size:13px}
.creq{font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-top:3px}
.ceffects{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px;display:flex;flex-direction:column;gap:1px}
.cresult{font-size:12px;color:var(--dim);margin-top:5px;font-style:italic}
.ctargets{font-family:var(--mono);font-size:10px;margin-top:5px;color:var(--dim)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 16px;z-index:20}
@media (prefers-reduced-motion:no-preference){.node{transition:box-shadow .12s,opacity .15s}.drawer{transition:transform .18s ease}}
</style>
</head>
<body>
<header class="topbar">
  <div class="masthead">FATE<span>·</span>STORYLINE MAP</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="search"><input id="q" type="search" placeholder="search scenes…" aria-label="Search scenes"></div>
</header>
<div class="legend">
  <span class="lg"><span class="sw"></span>authored sequence</span>
  <span class="lg"><span class="sw deal"></span>world-dealt pool</span>

  <span class="lg"><span class="dotk"></span>scene&nbsp;&nbsp;<span class="dotk" style="border-color:#B98A1F"></span>ending</span>
  <span class="lg">dashed border = random-pool scene · chip = speaker/fuse</span>
</div>
<main class="stage" id="stage"></main>

  <div class="dhead"><div class="dkicker" id="dkicker"></div><div class="dtitle" id="dtitle"></div><button class="dclose" id="dclose" aria-label="Close">✕</button></div>

</aside>

<script>
const DATA = {"chapters":[{"id":"hyperchute","title":"HYPERCHUTE","tagline":"A railway in the sky, built from a garage.","stats":{"scenes":18,"choices":45,"endings":5},"nodes":[{"id":"hyperchute:_deck","kind":"deck","title":"THE WORLD","prose":"Deals scenes into play as weeks pass.","x":80,"y":24,"w":96,"h":40},{"id":"hyperchute:_bank","kind":"bank","title":"$0","prose":"Treasury hits zero — the insolvency scene forces a rescue or the end.","x":80,"y":98,"w":96,"h":40},{"id":"hyperchute:h_entry","kind":"scene","title":"THE GARAGE","prose":"A rented unit above the Sudz & Spin laundromat in the Flats. Dryer heat, solder smoke, and one prototype shuttle hanging from the ceiling on a braided tether — a shoebox with rotors and a pneumatic drop-tube salvaged from a dead bank’s drive-through. On your screen, the incorporation papers say you own one hundred percent of a company called HYPERCHUTE. Through the window, a MERIDIAN drone hums past with someone’s cold-pressed juice. Nobody knows your name yet. That cuts both ways.","priority":false,"fuse":false,"choices":[{"label":"Book a corridor pilot with the city — proof before polish","effects":["set company:pilot_booked = true","Stress +5","Next scene → h_permit_wall"],"result":"You file the application at 2 a.m., high on it.","targets":["hyperchute:h_permit_wall"]},{"label":"Recruit an advisor before anyone important sees this","effects":["Next scene → h_priya_pitch"],"result":"Credibility is also infrastructure.","targets":["hyperchute:h_priya_pitch"]},{"label":"Incorporate clean — lawyer first, hardware second","effects":["Next scene → h_tomas_terms"],"result":"Paper first. It’s never just paper.","targets":["hyperchute:h_tomas_terms"]}],"x":24,"y":172,"w":208,"h":109},{"id":"hyperchute:h_priya_pitch","kind":"scene","title":"TWO PERCENT","speaker":"Priya Raghavan","prose":"Priya Raghavan routed freight across three continents and survived two bankruptcies that were not her fault. She gives the garage exactly four seconds of inspection. ‘You’ve built a machine that drops boxes out of the sky onto people’s homes. You have no permits, no insurer, and no idea which deputy commissioner already hates you. I can fix all three.’ She slides a term sheet across the workbench: two percent, vesting over twelve months, advisory role, introductions included.","priority":false,"fuse":false,"choices":[{"label":"“Welcome aboard.”","effects":["Meet Priya Raghavan","Priya Raghavan: affinity +2, respect +2","Priya Raghavan +2% equity","Founder score +1","Next scene → h_tomas_terms"],"result":"She shakes once, dry and firm, then starts a list titled THINGS THAT WILL KILL YOU FIRST.","targets":["hyperchute:h_tomas_terms"]},{"label":"“Cash when the angel money lands. Waitlist me.”","effects":["Meet Priya Raghavan","Priya Raghavan: affinity -1","set company:priya_waitlist = true","Stress +2"],"result":"Her smile doesn’t move. ‘Sure. I’ll be here.’","targets":[]},{"label":"“I’ll go it alone.”","effects":["Meet Priya Raghavan","Priya Raghavan: affinity -2, respect -1","set company:priya_declined = true","Stress +2"],"result":"Nineteen years of pattern recognition folds its term sheet and leaves without another word.","targets":[]}],"x":24,"y":315,"w":208,"h":109},{"id":"hyperchute:h_tomas_terms","kind":"scene","title":"TWO WAYS TO PAY ME","speaker":"Tomás Reyes","prose":"Tomás Reyes does contracts out of a converted shipping container downtown and bills like a man who has read every clause he has ever written. ‘Everyone wants the big-firm lawyer until the invoice lands,’ he says. He writes two numbers on the garage wall in marker: $18,000 flat. Or one percent — “and my rolodex goes with it.”","priority":false,"fuse":false,"choices":[{"label":"$18,000 cash","requires":"treasury ≥ +$18,000","effects":["Treasury −$18,000","Meet Tomás Reyes","Tomás Reyes: affinity +1","set company:legal_solid = true"],"result":"He drafts the IP assignment before he leaves. Everything you build now actually belongs to the company.","targets":[]},{"label":"One percent, plus the rolodex","effects":["Meet Tomás Reyes","Tomás Reyes: affinity +2, respect +2","Tomás Reyes +1% equity","set company:lawyer_ally = true","Founder score +1"],"result":"‘Smart,’ he says, pocketing the marker. ‘Broke founders make the best clients. Something to prove.’","targets":[]},{"label":"Download templates. How hard can it be?","effects":["Stress +4","set company:diy_legal = true"],"result":"The templates are fine. Probably. The templates are probably fine.","targets":[]}],"x":24,"y":458,"w":208,"h":94},{"id":"hyperchute:h_permit_wall","kind":"scene","title":"NO PROVEN DESCENT SAFETY CASE","speaker":"Office of Aerial Corridors","prose":"The Office of Aerial Corridors denies your pilot application in 0.4 seconds. The rejection notice cc’s three departments you have never heard of and one — Department of Sidewalk Integrity — that sounds invented. At the bottom, in machine-perfect passive voice: REAPPLICATION PERMITTED UPON DEMONSTRATED DESCENT COMPLIANCE.","priority":true,"fuse":true,"choices":[{"label":"File a full appeal with engineered descent data","effects":["Treasury −$6,000","Stress +6","set company:corridor = \"appealed\"","set company:permit_done = true","Meet Office of Aerial Corridors"],"result":"Three weeks to a hearing. Your descent-safety case is forty pages of hope formatted as engineering.","targets":[]},{"label":"Launch unlicensed over your own block. Beg forgiveness.","effects":["Stress +8","Reputation −1","set company:corridor = \"rogue\"","set company:permit_done = true","Meet Office of Aerial Corridors"],"result":"Twelve perfect drops onto your own roof. A neighbor films the thirteenth.","targets":[]},{"label":"Lobby. Quietly, properly, expensively.","requires":"has met Tomás Reyes AND NOT (flag company:lawyer_ally = true)","effects":["Treasury −$9,000","set company:corridor = \"granted\"","set company:permit_done = true","Meet Office of Aerial Corridors","Office of Aerial Corridors: affinity +1"],"result":"Tomás knows which consultant owns which signature. Nine days later, the pilot corridor exists.","targets":[]},{"label":"Call in Tomás’ favor","requires":"flag company:lawyer_ally = true","effects":["set company:corridor = \"granted\"","set company:permit_done = true","Tomás Reyes: affinity +1","Stress −2","Meet Office of Aerial Corridors"],"result":"Tomás makes one call from the container. ‘Fast-tracked. Don’t make me spend this twice.’","targets":[]}],"x":24,"y":586,"w":208,"h":94},{"id":"hyperchute:h_hearing","kind":"scene","title":"THE DESCENT-SAFETY HEARING","prose":"Room 4-B of the Office of Aerial Corridors smells like toner and judgment. Your forty pages of hope-formatted-as-engineering hold up better than anyone expected — the descent case survives two rounds of questions and one live demo video that makes a commissioner say “huh” out loud. Deliberation lasts eleven minutes. The pilot corridor is granted.","priority":true,"fuse":true,"choices":[{"label":"Accept the corridor. Fly legal.","effects":["set company:corridor = \"granted\"","Reputation +1","Founder score +1","Stress −5","Meet Office of Aerial Corridors","Office of Aerial Corridors: respect +1"],"result":"Stamped, sealed, e-mailed. The sky over the Flats is officially yours — two hundred feet at a time.","targets":[]}],"x":24,"y":714,"w":208,"h":94},{"id":"hyperchute:h_june_via_tomas","kind":"scene","title":"THE ANGEL","prose":"June Park arrives thirty seconds after Tomás, because she was never far away. Eleven angel checks; an instinct she calls pattern-matching and everyone else calls luck. She walks under the tethered shuttle, looks up for a long moment, and says: “A railway in the sky. Huh. My grandmother rode a train two days to reach a port. People will pay for gravity that behaves.”","priority":true,"fuse":false,"choices":[{"label":"Hear her out","effects":[],"targets":["hyperchute:h_june_term"]}],"x":24,"y":842,"w":208,"h":94},{"id":"hyperchute:h_june_cold","kind":"scene","title":"SOMEONE IS WATCHING YOUR DEMO","prose":"The rooftop test footage leaks — of course it leaks — and by Friday it has four hundred thousand views and a comment section arguing about property values. Monday morning, a woman in an expensive jacket is downstairs in the laundromat asking which unit is yours. June Park does not wait for permission to climb the stairs.","priority":true,"fuse":false,"choices":[{"label":"Hear her out","effects":[],"targets":["hyperchute:h_june_term"]}],"x":24,"y":970,"w":208,"h":94},{"id":"hyperchute:h_june_term","kind":"scene","title":"ONE FIFTY FOR EIGHT","speaker":"June Park","prose":"June turns her phone around: a wiring diagram of your own shuttle, annotated in three colors. ‘I read everything. Here’s my number. One hundred fifty thousand for eight percent. I don’t lead rounds I can’t defend at dinner parties — and a railway in the sky? I can defend that.’","priority":false,"fuse":false,"choices":[{"label":"Take the check","effects":["Treasury +$150,000","Meet June Park","June Park +8% equity","June Park: affinity +1","Founder score +2","Stress −4","set company:angel_funded = true"],"result":"The wire clears Wednesday. The garage suddenly smells like possibility instead of dryer sheets.","targets":[]},{"label":"“Six percent.” See if she flinches","effects":["Treasury +$150,000","Meet June Park","June Park +7% equity","June Park: affinity -1, respect +1","Founder score +2","Stress −3","set company:angel_funded = true"],"result":"She doesn’t blink. ‘Seven. Because you asked. Don’t negotiate with me twice.’","targets":[]},{"label":"Stay clean while it’s still yours","effects":["Meet June Park","June Park: affinity +1, respect +1","Stress +4","set company:bootstrapping = true"],"result":"She leaves a card on the workbench anyway. ‘When you’re ready to move, move fast. Doors like me don’t stay open.’","targets":[]}],"x":24,"y":1098,"w":208,"h":94},{"id":"hyperchute:h_first_drops_clean","kind":"scene","title":"BEAM DOWN","prose":"Shuttle One holds station two hundred feet above the Delgado house at 6:58 a.m. The tube coughs once — then the parcel drops through the receiver sleeve and lands on the porch soft as rain. Mrs. Delgado films it screaming. By noon there are sixty names on a waiting list scrawled on the back of a parking citation.","priority":true,"fuse":false,"choices":[{"label":"Open the list. Take every customer you can.","effects":["Revenue +$2,400/wk","Burn +$1,500/wk","Stress −5","Reputation +1","Founder score +2","set company:drops_done = true"],"result":"Growth is a decision. You just made it.","targets":["hyperchute:h_sofia_hire"]},{"label":"Cap it at twenty homes. Do it right first.","effects":["Revenue +$1,400/wk","Stress −8","Reputation +1","Founder score +1","set company:drops_done = true","set company:slow_growth = true"],"result":"Twenty porches, zero failures. Sofia would call that a dataset. Priya would call it leaving money outside.","targets":["hyperchute:h_sofia_hire"]}],"x":24,"y":1226,"w":208,"h":94},{"id":"hyperchute:h_first_drops_rogue","kind":"scene","title":"TWELVE ROOFS, NO PERMISSION","prose":"Without a corridor you fly dawn shifts only, dropping to friends-of-friends who sign waivers printed at the laundromat. The money is real. So is the compliance van that circled the block twice last night, drone-shaped shadow and all.","priority":true,"fuse":false,"choices":[{"label":"Keep flying grey until the hearing","effects":["Revenue +$1,900/wk","Stress +6","Reputation +1","Founder score +1","set company:drops_done = true","set company:grey_market = true"],"result":"Underground railways run on nerve. Yours is holding. For now.","targets":["hyperchute:h_sofia_hire"]},{"label":"Ground the fleet. Volunteer the tech to the food bank.","effects":["Revenue +$300/wk","Stress −4","Reputation +2","Founder score +2","set company:drops_done = true","set company:foodbank = true"],"result":"Legal, slow, and photographed. The city attorney follows the account. So does June Park.","targets":["hyperchute:h_sofia_hire"]}],"x":24,"y":1354,"w":208,"h":94},{"id":"hyperchute:h_sofia_hire","kind":"scene","title":"READ YOUR CAP TABLE — IT’S CUTE","speaker":"Sofia Brandt","prose":"Sofia Brandt wrote kill-switch software for wind turbines and treats altitude the way surgeons treat scalpels. She reads your flight logs on the stairs, fixes a gimbal jitter nobody had noticed, and names her price without looking up: nine five a month. Then she glances at your incorporation papers. “Or three points. I’ve read your cap table — it’s cute.”","priority":true,"fuse":true,"choices":[{"label":"$9,500 a month, full-time","effects":["Burn +$9,500/wk","Meet Sofia Brandt","Sofia Brandt: affinity +1","Stress −2","set company:sofia_resolved = true","set company:sofia_full = true"],"result":"By Friday she has rewritten the descent controller and deleted half of it. The code is smaller. It falls better.","targets":[]},{"label":"Three points","effects":["Burn +$5,200/wk","Meet Sofia Brandt","Sofia Brandt +3% equity","Sofia Brandt: respect +1","Founder score +1","set company:sofia_resolved = true","set company:sofia_equity = true"],"result":"‘Points it is.’ She shakes like she’s closing a merger. Half-time, all-heart, and your burn survives the month.","targets":[]},{"label":"Contract her part-time, month to month","effects":["Burn +$4,000/wk","Meet Sofia Brandt","Sofia Brandt: affinity -1","Stress +3","set company:sofia_resolved = true","set company:sofia_parttime = true"],"result":"‘Month to month,’ she repeats, in the tone people use for things that end badly.","targets":[]}],"x":24,"y":1482,"w":208,"h":94},{"id":"hyperchute:h_marcus_card","kind":"scene","title":"A BLACK CAR BELOW THE LAUNDROMAT","speaker":"Marcus Vale","prose":"Marcus Vale sends the car away and takes the stairs himself, which is his entire pitch. VP of Logistics Networks, MERIDIAN. He looks at the shuttle the way a man looks at a rival’s child — measuring how tall it might grow. “We considered tubes in ’27. Beautiful physics, ugly economics. Convince me yours grew up.”","priority":true,"fuse":false,"choices":[{"label":"Charm him. Rivals remember manners.","effects":["Meet Marcus Vale","Marcus Vale: affinity +1","Reputation +1","Stress +2","set company:meridian_watching = true"],"result":"He laughs once — real, at something you didn’t plan to say. The card he leaves is heavier than cards should be.","targets":[]},{"label":"Tell him MERIDIAN’s drones wake up whole streets","effects":["Meet Marcus Vale","Marcus Vale: hostile","Reputation +1","Founder score +1","Stress +4","set company:meridian_enemy = true"],"result":"His face does something expensive. ‘Spoken like a man who’s never been shouted at by a board.’ The stairs down are slower than the stairs up.","targets":[]},{"label":"Pitch him the partnership now","effects":["Meet Marcus Vale","Marcus Vale: affinity +1","Stress +3","set company:meridian_talks = true"],"result":"‘Not yet,’ he says, pleased you asked. ‘Grow a little. Ripeness is everything.’","targets":[]}],"x":24,"y":1610,"w":208,"h":94},{"id":"hyperchute:h_nadia_call","kind":"scene","title":"THE JOURNALIST","speaker":"Nadia Osei","prose":"Nadia Osei writes the column founders pretend not to read. Her email is four words long: “Coffee? Off record?” Underneath, unasked-for, is her piece about MERIDIAN’s warehouse injuries — the one that got a VP moved to a satellite office. She is dangerous in both directions and wants you to know she knows it.","priority":false,"fuse":false,"choices":[{"label":"Full access. Show her everything.","effects":["Meet Nadia Osei","Nadia Osei: affinity +2, respect +1","Reputation +2","Founder score +1","Stress +3","set company:press_friend = true"],"result":"She spends a day in the garage asking the questions investors are too polite for. The profile runs under the headline THE RAILWAY IN THE SKY.","targets":[]},{"label":"Off the record, carefully","effects":["Meet Nadia Osei","Nadia Osei: affinity +1","set company:press_cautious = true"],"result":"Two hours, two coffees, nothing usable and nothing burned. She respects the discipline. She notes it.","targets":[]},{"label":"No comment","effects":["Meet Nadia Osei","Nadia Osei: affinity -2, hostile","set company:press_enemy = true"],"result":"‘Everyone says that before the interesting part happens,’ she says, and writes something down anyway.","targets":[]}],"x":24,"y":1738,"w":208,"h":94},{"id":"hyperchute:h_act1_close","kind":"scene","title":"ELEVEN WEEKS IN","prose":"The laundromat owner raises your rent and calls it congratulations. The waiting list is a spreadsheet now. There is money in the account that did not come from anyone’s savings, and there is a folder of letters from the Office of Aerial Corridors thicker than the Bible in the room next door. Whatever comes next — the clone, the war, the thing nobody has thought of yet — the railway is real. You built that. With help you chose well or didn’t.","priority":true,"fuse":false,"choices":[{"label":"Face year two","effects":["Founder score +2","Stress −4","set company:act1_done = true"],"result":"Year two begins the way year one ended: faster than expected.","targets":["hyperchute:h_stub_fight"]}],"x":24,"y":1866,"w":208,"h":109},{"id":"hyperchute:h_stub_fight","kind":"scene","title":"THE CLONE — STUB","prose":"MERIDIAN launches Chute — same stops, same tubes, their logo where yours was. They undercut you by forty percent and lose money on every drop with a smile. This is the fight the design doc promises: gig-driver politics, permit wars, clone underpricing. Authored in Phase Two. Tonight it is a placeholder wearing a very good suit.","priority":true,"fuse":false,"choices":[{"label":"Fight on the streets — price, service, stubbornness","effects":["Stress +6","Reputation +1","Founder score +1","set company:fight_done = true","set company:street_fight = true"],"result":"Placeholder resistance. The real war arrives with Act Two authoring.","targets":[]},{"label":"Go over the top: publish open standards","effects":["Stress +3","Reputation +2","Founder score +1","set company:fight_done = true","set company:opensourced_standards = true"],"result":"You publish the tube-interface spec free for anyone. The internet notices. MERIDIAN’s lawyers notice harder.","targets":[]}],"x":24,"y":2009,"w":208,"h":94},{"id":"hyperchute:h_stub_offer","kind":"scene","title":"MERIDIAN MAKES THE CALL — STUB","speaker":"Marcus Vale","prose":"Marcus Vale’s assistant books forty minutes and Marcus uses eight. “Acquisition. Generous multiple. Your network inside ours, your name on the building. Or keep bleeding charmingly, and we’ll see whose tubes the city loves in March.” It is a good offer. That is what makes it a problem.","priority":true,"fuse":false,"choices":[{"label":"Sell. Dissolve into MERIDIAN.","effects":["■ ENDS CHAPTER — \"acquired\""],"targets":[]},{"label":"Negotiate yourself instead of the company — rise inside the beast","requires":"Marcus Vale affinity ≥ 1","effects":["■ ENDS CHAPTER — \"become_them\""],"targets":[]},{"label":"Refuse, and become worth buying later","effects":["Stress +4","Founder score +1","set company:offer_done = true"],"result":"You say no in two syllables and mean all of them.","targets":["hyperchute:h_stub_scale"]}],"x":24,"y":2137,"w":208,"h":94},{"id":"hyperchute:h_stub_scale","kind":"scene","title":"SCALE OR SINCERITY — STUB","prose":"Thirty corridors. Three cities. A manufacturing partner in Fresno who calls you “kid” and delivers early anyway. IPO bankers leave voicemails that sound like marriage proposals. This is where elite play earns the people’s-network listing — and where the accident lives in the full design. Placeholder for now: choose your trajectory.","priority":true,"fuse":false,"choices":[{"label":"Ride for the listing","requires":"founder score ≥ 8 AND reputation ≥ 3","effects":["■ ENDS CHAPTER — \"triumph_ipo\""],"targets":[]},{"label":"Open-source the stack and walk away","effects":["■ ENDS CHAPTER — \"walkaway_opensource\""],"targets":[]},{"label":"Keep building; let the biography decide","effects":["set company:scaled_done = true","Stress +3"],"result":"The voicemails keep coming. You keep building.","targets":[]}],"x":24,"y":2265,"w":208,"h":94},{"id":"hyperchute:h_insolvency","kind":"scene","title":"RUNWAY ZERO","prose":"Payroll bounces. The bank’s notification tone is almost apologetic. Every founder learns this exact silence — the inbox that stops answering. HYPERCHUTE has weeks, maybe less. But doors remain, even now. They’re just all ugly.","priority":false,"fuse":false,"choices":[{"label":"Bridge loan against everything","requires":"NOT (flag company:bridge_used = true)","effects":["Treasury +$40,000","Stress +12","set company:bridge_used = true"],"result":"Signed at 11 p.m., against the IP, the shuttles, and — reading the clauses closely — possibly the tube itself.","targets":[]},{"label":"Down round — June doubles down on you","requires":"has met June Park AND NOT (flag company:down_used = true)","effects":["Treasury +$90,000","June Park +10% equity","June Park: respect -1","Stress +10","set company:down_used = true"],"result":"She wires it before the term sheet finishes printing. ‘This is the cheap money. Don’t make me do it again.’","targets":[]},{"label":"Acqui-hire: the team survives, the dream doesn’t","requires":"has met Marcus Vale","effects":["■ ENDS CHAPTER — \"acquired\""],"result":"MERIDIAN takes the engineers, the patents, and the domain name. The railway becomes a slide in someone else’s deck.","targets":[]},{"label":"Surrender","effects":["■ ENDS CHAPTER — \"bankrupt\""],"result":"You pay the final invoices from personal savings. Sixty customers send cards. The Flats still calls it the railway.","targets":[]}],"x":24,"y":2393,"w":208,"h":94},{"id":"hyperchute:end:triumph_ipo","kind":"ending","title":"THE PEOPLE’S NETWORK","prose":"HYPERCHUTE lists at 9:31 a.m. Mrs. Delgado holds the ceremonial button on the exchange floor, still wearing her house slippers under the borrowed coat. The railway in the sky belongs to the street it was built for — and to the founder who refused, in order: a giant, a discount, and common sense.","endKind":"triumph","x":44,"y":2521,"w":168,"h":58},{"id":"hyperchute:end:acquired","kind":"ending","title":"DISSOLVED INTO BLUE","prose":"The tubes still run. They are painted MERIDIAN blue now, and they stop where the margins are best, not where people live. You are rich, which is not the same as right. The Flats keeps your sticker on the receiver sleeve anyway.","endKind":"sale","x":44,"y":2613,"w":168,"h":58},{"id":"hyperchute:end:bankrupt","kind":"ending","title":"BANKRUPT BUT BELOVED","prose":"The receivers take the shuttles; nobody can repossess what the neighborhood saw. Sixty porches watched parcels fall out of the sky like weather that loved them. Doors close. Some of them stay unlocked.","endKind":"noble","x":44,"y":2705,"w":168,"h":58},{"id":"hyperchute:end:become_them","kind":"ending","title":"YOU BECAME WHAT YOU FOUGHT","prose":"The badge is heavy and gets lighter every year. Your old prototype hangs in the MERIDIAN lobby under glass, labeled HERITAGE ARTIFACT. Sometimes you ride past the laundromat in the black car and do not look up.","endKind":"disgrace","x":44,"y":2797,"w":168,"h":58},{"id":"hyperchute:end:walkaway_opensource","kind":"ending","title":"THE STACK BELONGS TO EVERYONE","prose":"You publish everything: flight controller, tube spec, descent safety case. Within a year there are four hundred small railways over four hundred neighborhoods wearing different names. Yours is not one of them. That was the point.","endKind":"transformation","x":44,"y":2889,"w":168,"h":58}],"edges":[],"width":256,"height":2971},{"id":"teleport","title":"TELEPORT","tagline":"Be there without going.","stats":{"scenes":3,"choices":7,"endings":3},"nodes":[{"id":"teleport:_deck","kind":"deck","title":"THE WORLD","prose":"Deals scenes into play as weeks pass.","x":80,"y":24,"w":96,"h":40},{"id":"tel const stage=document.getElementById('stage'),tabs=document.getElementById('tabs'),q=document.getElementById('q');
const drawer=document.getElementById('drawer'),dk=document.getElementById('dkicker');
let currentTab='all';
const adj={},radj={};
DATA.chapters.forEach(ch=>{ch.edges.forEach(e=>{(adj[e.from]=adj[e.from]||new Set()).add(e.to);(radj[e.to]=radj[e.to]||new Set()).add(e.from);});});
function bfs(start,map){const seen=new Set([start]);const st=[start];while(st.length){const n=st.pop();for(const m of(map[n]||[]))if(!seen.has(m)){seen.add(m);st.push(m);}}return seen;}
function clearFocus(){document.querySelectorAll('.node.sel,.node.lit,.node.dimmed').forEach(n=>n.classList.remove('sel','lit','dimmed'));document.querySelectorAll('.edge.hl,.edge.dimmed').forEach(n=>n.classList.remove('hl','dimmed'));delete document.body.dataset.focus;}
function applyFocus(rootId,dir){clearFocus();document.body.dataset.focus='1';const map=dir==='down'?adj:radj;const lit=bfs(rootId,map);
  document.querySelectorAll('.node').forEach(el=>{if(!laneVisible(el))return;const id=el.dataset.id;
    if(lit.has(id)){el.classList.add(el.dataset.id===rootId?'sel':'lit');}else{el.classList.add('dimmed');}});
  document.querySelectorAll('.edge').forEach(el=>{
    const on=lit.has(el.dataset.from)&&lit.has(el.dataset.to);
    el.classList.toggle('hl',on);el.classList.toggle('dimmed',!on);});
  const sel=document.querySelector('.node.sel');if(sel)sel.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});}
function laneVisible(el){const lane=el.closest('.lane');return !currentTab||currentTab==='all'||lane.dataset.ch===currentTab;}
DATA.chapters.forEach(ch=>{
  tabs.insertAdjacentHTML('beforeend','<button class="tab" data-ch="'+ch.id+'">'+ch.title+'</button>');
  const lane=document.createElement('section');lane.className='lane';lane.dataset.ch=ch.id;
  lane.innerHTML='<div class="lane-head"><span class="lane-title">'+ch.title+'</span><span class="lane-tag">'+ch.tagline+'</span><span class="lane-stats">'+ch.stats.scenes+' scenes · '+ch.stats.choices+' choices · '+ch.stats.endings+' endings</span></div>';
  const canvas=document.createElement('div');canvas.className='canvas';
  canvas.style.width=ch.width+'px';canvas.style.height=ch.height+'px';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','edges');
  // Mount FIRST so edge-path lookups can find nodes in the document.
  lane.appendChild(canvas);stage.appendChild(lane);
  ch.nodes.forEach(n=>{const el=document.createElement('div');el.className='node '+n.kind+(n.kind==='scene'&&!n.priority?' pool':'')+(n.endKind?' k-'+n.endKind:'');el.dataset.id=n.id;el.style.left=n.x+'px';el.style.top=n.y+'px';el.style.width=n.w+'px';el.style.minHeight=n.h+'px';
    let inner='<div class="ntitle">'+n.title+'</div>';
    if(n.kind==='scene'&&n.prose)inner+='<div class="ngist">'+n.prose.slice(0,150)+'…</div>';
    const chips=[];if(n.speaker)chips.push('<span class="chip spk">'+n.speaker+'</span>');if(n.fuse)chips.push('<span class="chip">⏱ FUSE</span>');
    if(chips.length)inner+='<div class="chiprow">'+chips.join('')+'</div>';
    el.innerHTML=inner;canvas.appendChild(el);el._node=n;
    el.addEventListener('click',ev=>{ev.stopPropagation();
      if(n.kind==='ending'){applyFocus(n.id,'up');openDrawer(n,ch);}
      else if(n.kind==='scene'){applyFocus(n.id,'down');openDrawer(n,ch);}
      else clearFocus();});});
  canvas.prepend(svg);
  ch.edges.forEach(e=>{const p=pathFor(ch,e);if(!p)return;const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('class','edge '+e.cls);el.setAttribute('d',p);el.dataset.from=e.from;el.dataset.to=e.to;svg.appendChild(el);});
});
function nodeEl(id){return document.querySelector('.node[data-id="'+CSS.escape(id)+'"]');}
function pathFor(ch,e){const a=nodeEl(e.from),b=nodeEl(e.to);if(!a||!b)return null;const n1=a._node,n2=b._node;
  const x1=n1.x+n1.w,y1=n1.y+n1.h/2,x2=n2.x,y2=n2.y+n2.h/2;const dx=Math.max(36,(x2-x1)*0.45);
  return 'M'+x1+','+y1+' C'+(x1+dx)+','+y1+' '+(x2-dx)+','+y2+' '+x2+','+y2;}
function openDrawer(n,ch){
  dk.textContent=(n.kind==='ending'?('ENDING · '+n.endKind):ch.title)+(n.speaker?(' · '+n.speaker):'');
  document.getElementById('dtitle').textContent=n.title;
  const body=document.getElementById('dbody');let html='';
  if(n.prose)html+='<div class="dspeaker">'+(n.speaker?n.speaker+' — ':'')+(n.kind==='ending'?'':'')+'</div><p class="dprose">'+n.prose+'</p>';
  if(n.choices&&n.choices.length){html+='<div class="dchoices">';
    n.choices.forEach(c=>{const jump=c.targets.length>0;const tid=jump?c.targets[0]:null;
      html+='<div class="choice'+(jump?' jump':'')+'"'+(tid?' data-tid="'+tid+'"':'')+'>'
        +'<div class="clabel">'+c.label+'</div>'
        +(c.requires?'<div class="creq">requires '+c.requires+'</div>':'')
        +(c.effects.length?'<div class="ceffects">'+c.effects.map(x=>'<span>'+x+'</span>').join('')+'</div>':'')
        +(c.result?'<div class="cresult">'+c.result+'</div>':'')
        +(jump?'<div class="ctargets">→ '+c.targets.map(t=>{const tn=DATA.chapters.flatMap(c=>c.nodes).find(nn=>nn.id===t);return tn?tn.title:t}).join(', ')+'</div>':'')
      +'</div>';});
    html+='</div>';}
  body.innerHTML=html;drawer.classList.add('open');
  body.querySelectorAll('.choice.jump').forEach(el=>el.addEventListener('click',()=>{const t=nodeEl(el.dataset.tid);if(t)t.click();}));
}
tabs.addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
  currentTab=b.dataset.ch;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  document.querySelectorAll('.lane').forEach(l=>{l.style.display=(currentTab==='all'||l.dataset.ch===currentTab)?'':'none';});
  clearFocus();drawer.classList.remove('open');});
{const all=document.createElement('button');all.className='tab on';all.dataset.ch='all';all.textContent='ALL CHAPTERS';tabs.prepend(all);}
document.getElementById('dclose').addEventListener('click',()=>{drawer.classList.remove('open');clearFocus();});
stage.addEventListener('click',e=>{if(e.target===stage||e.target.classList.contains('canvas')){drawer.classList.remove('open');clearFocus();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){drawer.classList.remove('open');clearFocus();}});
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();document.querySelectorAll('.node').forEach(el=>{const n=el._node;if(!n)return;const hit=!v||(n.title+' '+(n.prose||'')).toLowerCase().includes(v);el.style.opacity=hit?'':'0.15';el.style.order=hit?'':'-1';});});
</script>
</body>
