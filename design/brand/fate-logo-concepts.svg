<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <rect width="1600" height="1080" fill="#fafaf7"/>

  <g fill="#16181d">
    <text x="64" y="74" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="34" font-weight="900" letter-spacing="7">FATE</text>
    <text x="64" y="112" font-family="IBM Plex Mono, Menlo, monospace" font-size="15" letter-spacing="3" fill="#7c7e76">IDENTITY DIRECTIONS · ONE LIFE, THREE COMPANIES</text>
  </g>

  <!-- A · THE RECORD -->
  <g>
    <rect x="48" y="152" width="736" height="402" rx="18" fill="#ffffff" stroke="#dadbd3" stroke-width="2"/>
    <text x="84" y="198" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#b4540a">A · THE RECORD</text>
    <rect x="84" y="230" width="224" height="224" rx="48" fill="#16181d"/>
    <g fill="#fafaf7">
      <rect x="144" y="278" width="48" height="130"/>
      <rect x="144" y="278" width="111" height="43"/>
      <rect x="144" y="331" width="89" height="39"/>
    </g>
    <path d="M119 390 L277 304" fill="none" stroke="#b4540a" stroke-width="15" stroke-linecap="square"/>
    <text x="354" y="358" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="92" font-weight="900" letter-spacing="11" fill="#16181d">FATE</text>
    <path d="M344 386 L727 294" fill="none" stroke="#b4540a" stroke-width="10"/>
    <text x="354" y="426" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="2" fill="#7c7e76">THE LIFE LEAVES A MARK.</text>
    <text x="84" y="512" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#7c7e76">A permanent scar crosses the record.</text>
  </g>

  <!-- B · THE THROUGHLINE -->
  <g>
    <rect x="816" y="152" width="736" height="402" rx="18" fill="#ffffff" stroke="#dadbd3" stroke-width="2"/>
    <text x="852" y="198" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#b4540a">B · THE THROUGHLINE</text>
    <rect x="852" y="230" width="224" height="224" rx="48" fill="#16181d"/>
    <rect x="906" y="284" width="25" height="118" fill="#fafaf7"/>
    <rect x="947" y="266" width="35" height="154" fill="#fafaf7"/>
    <rect x="998" y="292" width="25" height="102" fill="#fafaf7"/>
    <path d="M880 343 H1034" fill="none" stroke="#b4540a" stroke-width="12"/>
    <circle cx="1043" cy="343" r="17" fill="#b4540a"/>
    <text x="1120" y="350" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="88" font-weight="900" letter-spacing="9" fill="#16181d">FATE</text>
    <path d="M1122 384 H1486" fill="none" stroke="#b4540a" stroke-width="8"/>
    <circle cx="1496" cy="384" r="13" fill="#b4540a"/>
    <text x="1122" y="426" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="2" fill="#7c7e76">ONE LINE. THREE GATES.</text>
    <text x="852" y="512" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#7c7e76">The founder continues; the companies do not.</text>
  </g>

  <!-- C · THE FORK -->
  <g>
    <rect x="48" y="586" width="736" height="402" rx="18" fill="#ffffff" stroke="#dadbd3" stroke-width="2"/>
    <text x="84" y="632" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#b4540a">C · THE FORK</text>
    <rect x="84" y="664" width="224" height="224" rx="48" fill="#16181d"/>
    <path d="M151 837 V791 C151 752 174 738 199 718" fill="none" stroke="#fafaf7" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M151 791 C151 752 199 737 236 700" fill="none" stroke="#b4540a" stroke-width="20" stroke-linecap="square"/>
    <path d="M228 694 L255 690 L248 717" fill="#b4540a"/>
    <text x="354" y="790" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="92" font-weight="900" letter-spacing="11" fill="#16181d">FATE</text>
    <path d="M421 804 L462 718 L501 804" fill="none" stroke="#b4540a" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter"/>
    <text x="354" y="858" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="2" fill="#7c7e76">ONLY ONE ROAD CONTINUES.</text>
    <text x="84" y="946" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#7c7e76">Choice is visible; consequence is final.</text>
  </g>

  <!-- D · THE PERIOD -->
  <g>
    <rect x="816" y="586" width="736" height="402" rx="18" fill="#ffffff" stroke="#dadbd3" stroke-width="2"/>
    <text x="852" y="632" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="3" fill="#b4540a">D · THE PERIOD</text>
    <rect x="852" y="664" width="224" height="224" rx="48" fill="#16181d"/>
    <g fill="#fafaf7">
      <rect x="914" y="713" width="48" height="126"/>
      <rect x="914" y="713" width="100" height="40"/>
      <rect x="914" y="766" width="77" height="36"/>
    </g>
    <circle cx="1018" cy="823" r="19" fill="#b4540a"/>
    <text x="1120" y="790" font-family="Arial Black, Helvetica Neue, sans-serif" font-size="92" font-weight="900" letter-spacing="11" fill="#16181d">FATE</text>
    <circle cx="1489" cy="768" r="16" fill="#b4540a"/>
    <text x="1122" y="858" font-family="IBM Plex Mono, Menlo, monospace" font-size="14" letter-spacing="2" fill="#7c7e76">EVERY CHOICE ENDS A SENTENCE.</text>
    <text x="852" y="946" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#7c7e76">The current FATE· motif, made definitive.</text>
  </g>

  <text x="800" y="1040" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" letter-spacing="2" fill="#7c7e76">INK #16181D · PAPER #FAFAF7 · BURNT ORANGE #B4540A</text>
</svg>
