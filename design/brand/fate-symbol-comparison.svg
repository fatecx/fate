<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <mask id="moon-crescent">
      <rect width="256" height="256" fill="#000"/>
      <circle cx="128" cy="128" r="90" fill="#fff"/>
      <circle cx="170" cy="94" r="78" fill="#000"/>
    </mask>

    <g id="mark-thread">
      <g fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M88 72L128 32L168 72"/>
        <path d="M72 88L32 128L72 168"/>
        <path d="M184 88L224 128L184 168"/>
        <path d="M88 184L128 224L168 184"/>
      </g>
      <path d="M48 128H112Q128 128 128 112V48" fill="none" stroke="#b4540a" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
    </g>

    <g id="mark-moon">
      <rect width="256" height="256" fill="currentColor" mask="url(#moon-crescent)"/>
      <path d="M65 168L94 151" fill="none" stroke="#b4540a" stroke-width="12" stroke-linecap="square"/>
    </g>

    <g id="mark-sphere" fill="none" stroke-linecap="square">
      <circle cx="128" cy="128" r="38" fill="#b4540a" stroke="none"/>
      <path d="M54 72A96 96 0 0 1 207 70" stroke="currentColor" stroke-width="15"/>
      <path d="M218 96A96 96 0 0 1 185 203" stroke="currentColor" stroke-width="15"/>
      <path d="M160 219A96 96 0 0 1 45 178" stroke="currentColor" stroke-width="15"/>
      <path d="M35 150A96 96 0 0 1 39 112" stroke="currentColor" stroke-width="15"/>
      <path d="M78 98A63 63 0 0 1 183 107" stroke="currentColor" stroke-width="12"/>
      <path d="M188 137A63 63 0 0 1 160 181" stroke="currentColor" stroke-width="12"/>
      <path d="M96 184A63 63 0 0 1 69 146" stroke="currentColor" stroke-width="12"/>
      <path d="M43 105L70 115M190 84L177 108M179 190L159 172" stroke="#b4540a" stroke-width="8"/>
    </g>

    <g id="mark-bell" fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M72 164V136Q72 69 128 69Q184 69 184 136V164" stroke="currentColor" stroke-width="18"/>
      <path d="M55 174H201" stroke="currentColor" stroke-width="18"/>
      <path d="M128 68V43" stroke="currentColor" stroke-width="18"/>
      <path d="M128 184V202" stroke="#b4540a" stroke-width="10"/>
